name: Compatibility gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: Run the fail-closed release evidence gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  WORLDSTREAM_BUILD_REVISION: ${{ github.sha }}
  WORLDSTREAM_BASE_IMAGE: alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
  WORLDSTREAM_RELEASE_INVENTORY: worldstream/release-inventory/cli-first-v1

jobs:
  release-clock:
    name: Frozen release critical-path clock
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      started_epoch_seconds: ${{ steps.clock.outputs.started_epoch_seconds }}
      deadline_epoch_seconds: ${{ steps.clock.outputs.deadline_epoch_seconds }}
    steps:
      - name: Start the four-hour release boundary before all producers
        id: clock
        shell: bash
        env:
          RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          started_epoch_seconds=$(date +%s)
          if [[ "$RELEASE_REQUESTED" == true ]]; then
            deadline_epoch_seconds=$((started_epoch_seconds + 14400))
          else
            deadline_epoch_seconds=0
          fi
          printf 'started_epoch_seconds=%s\n' "$started_epoch_seconds" >> "$GITHUB_OUTPUT"
          printf 'deadline_epoch_seconds=%s\n' "$deadline_epoch_seconds" >> "$GITHUB_OUTPUT"

  fast:
    name: Fast gates
    needs: release-clock
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
      - name: Prime locked Rust dependencies
        run: cargo fetch --locked
      - name: Install byte-pinned hosted security scanners
        run: scripts/gates-install-tools.sh
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned gate Python
        run: |
          uv python install 3.14.7
          uv sync --project sdk/python --locked
      - name: Run fast gates
        run: uv run --python 3.14.7 --no-project python scripts/gates.py fast --ci --offline

  native:
    name: Manifest platform ${{ matrix.cell }}
    needs: release-clock
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && 60 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: native-linux-x86_64
            platform: native-linux-x86_64
            runner: ubuntu-24.04
            shell: bash
            system: Linux
          - cell: native-windows-x64
            platform: native-windows-x64
            runner: windows-2025-vs2026
            shell: pwsh
            system: Windows
          - cell: oci-linux-amd64
            platform: oci-linux-amd64
            runner: ubuntu-24.04
            shell: bash
            system: Linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        shell: ${{ matrix.shell }}
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        shell: ${{ matrix.shell }}
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python
        shell: ${{ matrix.shell }}
        run: |
          uv python install 3.14.7
          uv sync --project sdk/python --locked
      - name: Prime locked Rust dependencies
        shell: ${{ matrix.shell }}
        run: cargo fetch --locked
      - name: Install byte-pinned hosted Linux security scanners
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: scripts/gates-install-tools.sh
      - name: Install byte-pinned hosted Windows security scanners
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: scripts/gates-install-tools.ps1
      - name: Install byte-pinned PostgreSQL 17.11 Linux provider clients
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-linux-x86_64' }}
        shell: bash
        run: scripts/gates-install-postgres-client.sh
      - name: Build release UI inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
        shell: ${{ matrix.shell }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web/console build
      - name: Build Linux release archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-linux-x86_64' }}
        shell: bash
        run: |
          export WORLDSTREAM_RELEASE_PYTHON="$(uv python find 3.14.7)"
          rustup target add x86_64-unknown-linux-musl
          export WORLDSTREAM_RUSTC="$(rustup which rustc)"
          export RUSTC="$WORLDSTREAM_RUSTC"
          zig_archive="$RUNNER_TEMP/zig-x86_64-linux-0.15.2.tar.xz"
          zig_root="$RUNNER_TEMP/zig-x86_64-linux-0.15.2"
          test ! -e "$zig_archive" && test ! -e "$zig_root"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            --output "$zig_archive"
          test "$(wc -c < "$zig_archive" | tr -d '[:space:]')" = "53733924"
          printf '%s  %s\n' '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239' "$zig_archive" \
            | sha256sum --check --strict -
          tar --extract --xz --file "$zig_archive" --directory "$RUNNER_TEMP"
          export WORLDSTREAM_ZIG="$zig_root/zig"
          export AR_x86_64_unknown_linux_musl="$(realpath scripts/zig-musl-ar.sh)"
          export CC_x86_64_unknown_linux_musl="$(realpath scripts/zig-musl-cc.sh)"
          rustc_host="$("$WORLDSTREAM_RUSTC" -vV | sed -n 's/^host: //p')"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$("$WORLDSTREAM_RUSTC" --print sysroot)/lib/rustlib/$rustc_host/bin/rust-lld"
          test -x "$WORLDSTREAM_RUSTC" && test -x "$WORLDSTREAM_ZIG" && test -x "$AR_x86_64_unknown_linux_musl" && test -x "$CC_x86_64_unknown_linux_musl" && test -x "$CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER"
          cargo build --release --locked --target x86_64-unknown-linux-musl --workspace
          mkdir -p dist/linux reports
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/package.py capture-build-environment \
            --target linux-x86_64 \
            --output reports/native-linux-build-environment.json
          SOURCE_DATE_EPOCH=0 scripts/package-release.sh \
            --target linux-x86_64 \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --binary-dir target/x86_64-unknown-linux-musl/release \
            --ui-dir web/console/dist \
            --sdk-dir sdk/python \
            --examples-dir examples \
            --licenses-dir licenses \
            --build-environment reports/native-linux-build-environment.json \
            --output dist/linux \
            --report reports/native-linux-package.json
          scripts/verify-release.sh \
            dist/linux/worldstream-$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')-linux-x86_64.tar.gz \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY"
      - name: Build Windows release archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-windows-x64' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsInstall) { throw 'Visual Studio C++ toolchain not found' }
          Import-Module (Join-Path $vsInstall 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsInstall -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          rustup target add x86_64-pc-windows-msvc
          $env:WORLDSTREAM_RUSTC = (rustup which rustc).Trim()
          $env:RUSTC = $env:WORLDSTREAM_RUSTC
          $env:AR_x86_64_pc_windows_msvc = (Get-Command lib.exe).Source
          $env:CC_x86_64_pc_windows_msvc = (Get-Command cl.exe).Source
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = (Get-Command link.exe).Source
          cargo build --release --locked --target x86_64-pc-windows-msvc --workspace
          New-Item -ItemType Directory -Force -Path dist/windows, reports | Out-Null
          $version = ([regex]::Match((Get-Content compatibility.toml -Raw), '(?m)^product\s*=\s*"([^"]+)"')).Groups[1].Value
          $archive = "dist/windows/worldstream-$version-windows-x64.zip"
          $report = 'reports/native-windows-package.json'
          $env:SOURCE_DATE_EPOCH = '0'
          $env:WORLDSTREAM_RELEASE_PYTHON = (uv python find 3.14.7).Trim()
          & $env:WORLDSTREAM_RELEASE_PYTHON -I scripts/package.py capture-build-environment --target windows-x64 --output reports/native-windows-build-environment.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/package-release.ps1 --target windows-x64 --release-inventory $env:WORLDSTREAM_RELEASE_INVENTORY --binary-dir target/x86_64-pc-windows-msvc/release --ui-dir web/console/dist --sdk-dir sdk/python --examples-dir examples --licenses-dir licenses --build-environment reports/native-windows-build-environment.json --output dist/windows --report $report
          & scripts/verify-release.ps1 $archive --release-inventory $env:WORLDSTREAM_RELEASE_INVENTORY
      - name: Configure pinned docker-container Buildx for OCI export
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'oci-linux-amd64' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          version: v0.36.1
      - name: Build and test OCI release image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'oci-linux-amd64' }}
        shell: bash
        run: |
          export WORLDSTREAM_RELEASE_PYTHON="$(uv python find 3.14.7)"
          rustup target add x86_64-unknown-linux-musl
          export WORLDSTREAM_RUSTC="$(rustup which rustc)"
          export RUSTC="$WORLDSTREAM_RUSTC"
          zig_archive="$RUNNER_TEMP/zig-x86_64-linux-0.15.2.tar.xz"
          zig_root="$RUNNER_TEMP/zig-x86_64-linux-0.15.2"
          test ! -e "$zig_archive" && test ! -e "$zig_root"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            --output "$zig_archive"
          test "$(wc -c < "$zig_archive" | tr -d '[:space:]')" = "53733924"
          printf '%s  %s\n' '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239' "$zig_archive" \
            | sha256sum --check --strict -
          tar --extract --xz --file "$zig_archive" --directory "$RUNNER_TEMP"
          export WORLDSTREAM_ZIG="$zig_root/zig"
          export AR_x86_64_unknown_linux_musl="$(realpath scripts/zig-musl-ar.sh)"
          export CC_x86_64_unknown_linux_musl="$(realpath scripts/zig-musl-cc.sh)"
          rustc_host="$("$WORLDSTREAM_RUSTC" -vV | sed -n 's/^host: //p')"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$("$WORLDSTREAM_RUSTC" --print sysroot)/lib/rustlib/$rustc_host/bin/rust-lld"
          test -x "$WORLDSTREAM_RUSTC" && test -x "$WORLDSTREAM_ZIG" && test -x "$AR_x86_64_unknown_linux_musl" && test -x "$CC_x86_64_unknown_linux_musl" && test -x "$CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER"
          cargo build --release --locked --target x86_64-unknown-linux-musl --workspace
          pnpm install --frozen-lockfile
          pnpm --dir web/console build
          mkdir -p dist reports
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/package.py capture-build-environment \
            --target oci-linux-amd64 \
            --output reports/oci-build-environment.json
          scripts/package-oci.sh \
            --binary-dir target/x86_64-unknown-linux-musl/release \
            --ui-dir web/console/dist \
            --sdk-dir sdk/python \
            --examples-dir examples \
            --licenses-dir licenses \
            --base-image "$WORLDSTREAM_BASE_IMAGE" \
            --build-environment reports/oci-build-environment.json \
            --output dist/oci-context \
            --report reports/oci-context.json
          version=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          manifest_sha256=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import json; print(json.load(open("dist/oci-context/oci-metadata.json"))["manifest_sha256"])')
          build_identity_sha256=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import json; print(json.load(open("dist/oci-context/oci-metadata.json"))["build_identity_sha256"])')
          build_environment_base64=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import json; print(json.load(open("dist/oci-context/oci-metadata.json"))["build_environment_base64"])')
          artifact="dist/worldstream-${version}-oci-linux-amd64.oci.tar"
          image_tag="worldstream-release:${version}"
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --provenance=false \
            --output "type=oci,dest=$artifact,compression=gzip,force-compression=true" \
            --tag "$image_tag" \
            --build-arg "WORLDSTREAM_BASE_IMAGE=$WORLDSTREAM_BASE_IMAGE" \
            --build-arg "VERSION=$version" \
            --build-arg "MANIFEST_SHA256=$manifest_sha256" \
            --build-arg "SOURCE_REVISION=$WORLDSTREAM_BUILD_REVISION" \
            --build-arg "BUILD_IDENTITY_SHA256=$build_identity_sha256" \
            --build-arg "BUILD_ENVIRONMENT_BASE64=$build_environment_base64" \
            --build-arg "SOURCE_DATE_EPOCH=0" \
            dist/oci-context
          scripts/oci-runtime-smoke.sh \
            --context dist/oci-context \
            --artifact "$artifact" \
            --image "$image_tag" \
            --skip-build \
            --report reports/oci-runtime-smoke.json
      - name: Start pinned PostgreSQL 17.11 on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          postgres_secret_dir="$RUNNER_TEMP/worldstream-postgres-bootstrap"
          postgres_password_file="$postgres_secret_dir/password"
          umask 077
          mkdir -p "$postgres_secret_dir"
          openssl rand -hex 24 > "$postgres_password_file"
          chmod 600 "$postgres_password_file"
          docker run --detach --name worldstream-postgres \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password \
            --env POSTGRES_DB=worldstream \
            --volume "$postgres_password_file:/run/secrets/postgres-password:ro" \
            --publish 127.0.0.1:5432:5432 \
            postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          for attempt in $(seq 1 60); do
            if docker exec worldstream-postgres pg_isready --username postgres --dbname worldstream; then
              break
            fi
            if [[ "$attempt" = 60 ]]; then
              docker logs worldstream-postgres
              exit 1
            fi
            sleep 1
          done
          pg_scheme=postgresql
          pg_user=postgres
          IFS= read -r pg_password < "$postgres_password_file"
          postgres_dsn_file="$RUNNER_TEMP/worldstream-postgresql.dsn"
          printf '%s://%s:%s@127.0.0.1:5432/worldstream\n' \
            "$pg_scheme" "$pg_user" "$pg_password" > "$postgres_dsn_file"
          chmod 600 "$postgres_dsn_file"
          printf 'WORLDSTREAM_POSTGRES_DSN_FILE=%s\n' "$postgres_dsn_file" >> "$GITHUB_ENV"
          printf 'WORLDSTREAM__STORAGE__POSTGRESQL__DSN_FILE=%s\n' "$postgres_dsn_file" >> "$GITHUB_ENV"
          printf 'WORLDSTREAM_POSTGRES_PASSWORD_FILE=%s\n' "$postgres_password_file" >> "$GITHUB_ENV"
      - name: Start runner PostgreSQL 17.11 on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: scripts/gates-install-postgres.ps1
      - name: Execute native Windows protected restore artifact tests
        if: ${{ matrix.platform == 'native-windows-x64' }}
        shell: pwsh
        run: |
          cargo test --locked -p worldstream-runtime filesystem::windows_tests::exclusively_creates_exact_owner_only_windows_file
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p worldstream-runtime filesystem::windows_tests::failed_windows_file_cleanup_scrubs_through_the_retained_handle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p worldstream-postgres native_restore::tests::native_windows_artifacts_are_exclusive_protected_and_identity_bound
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p worldstream-postgres native_restore::tests::native_windows_dump_publication_faults_leave_no_nonempty_public_artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p worldstream-postgres native_restore::tests::native_windows_dump_publication_collision_preserves_the_exact_sentinel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p worldstream-postgres native_restore::tests::native_windows_retained_parent_prevents_substitution_during_publication
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p worldstream-postgres native_restore::tests::native_windows_provider_guard_accepts_a_sole_successful_job
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p worldstream-postgres native_restore::tests::native_windows_provider_guard_waits_for_background_job_descendant_exit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove native gate process-tree deadline containment
        if: ${{ matrix.platform != 'oci-linux-amd64' }}
        shell: ${{ matrix.shell }}
        run: uv run --project sdk/python --locked python -m pytest -q tests/gate_smoke.py -k "test_gate_runner_kills_and_reaps_adversarial_child_and_detached_grandchild or test_gate_runner_windows_job_kills_and_reaps_child_and_grandchild"
      - name: Run manifest platform cell
        shell: ${{ matrix.shell }}
        env:
          WORLDSTREAM_TELEMETRY_HTTPS_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-linux-x86_64' && 'reports/telemetry-https.json' || '' }}
        run: uv run --python 3.14.7 --no-project python scripts/gates.py minimal-ci --ci --cell ${{ matrix.cell }} --report reports/${{ matrix.cell }}.json --offline
      - name: Run packaged Linux binaries against SQLite and PostgreSQL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-linux-x86_64' }}
        shell: bash
        run: |
          set -euo pipefail
          release_python="$(uv python find 3.14.7)"
          version=$("$release_python" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          packaged_control="$RUNNER_TEMP/worldstream-packaged-control/worldstreamctl"
          uv run --python 3.14.7 --no-project python scripts/native-package-smoke.py \
            --package-archive "dist/linux/worldstream-${version}-linux-x86_64.tar.gz" \
            --package-report reports/native-linux-package.json \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --admin-dsn-file "$WORLDSTREAM_POSTGRES_DSN_FILE" \
            --control-output "$packaged_control" \
            --report reports/native-linux-package-runtime.json
          printf 'WORLDSTREAM_PACKAGED_CTL=%s\n' "$packaged_control" >> "$GITHUB_ENV"
      - name: Run packaged Windows binaries against SQLite and PostgreSQL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-windows-x64' }}
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content compatibility.toml -Raw), '(?m)^product\s*=\s*"([^"]+)"')).Groups[1].Value
          $packagedControl = Join-Path $env:RUNNER_TEMP 'worldstream-packaged-control\worldstreamctl.exe'
          uv run --python 3.14.7 --no-project python scripts/native-package-smoke.py `
            --package-archive "dist/windows/worldstream-$version-windows-x64.zip" `
            --package-report reports/native-windows-package.json `
            --release-inventory $env:WORLDSTREAM_RELEASE_INVENTORY `
            --admin-dsn-file $env:WORLDSTREAM_POSTGRES_DSN_FILE `
            --control-output $packagedControl `
            --report reports/native-windows-package-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WORLDSTREAM_PACKAGED_CTL=$packagedControl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run hosted Linux PostgreSQL native backup restore and recovery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-linux-x86_64' }}
        shell: bash
        run: scripts/postgres-native-restore-linux-live.sh
      - name: Run hosted Windows PostgreSQL native backup restore and recovery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-windows-x64' }}
        shell: pwsh
        run: scripts/postgres-native-restore-windows-live.ps1
      - name: Produce typed Linux platform evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-linux-x86_64' }}
        shell: bash
        run: |
          set -euo pipefail
          release_python="$(uv python find 3.14.7)"
          version=$("$release_python" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          archive="dist/linux/worldstream-${version}-linux-x86_64.tar.gz"
          "$release_python" -I scripts/release-platform-diagnostic.py native \
            --source native-linux \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --package-report reports/native-linux-package.json \
            --gate-report reports/native-linux-x86_64.json \
            --runtime-report reports/native-linux-package-runtime.json \
            --native-restore-report reports/native-linux-postgres-restore.json \
            --native-fixture-report reports/native-linux-transfer-seed.json \
            --native-binding-parent "$RUNNER_TEMP/worldstream-native-restore-work" \
            --artifact "$archive" \
            --output-dir reports/platform-diagnostics
          "$release_python" -I - "$RUNNER_TEMP/worldstream-native-restore-work/worldstream-native-platform-binding" <<'PY'
          import stat
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          children = list(root.iterdir())
          if len(children) != 5 or any(
              not stat.S_ISREG(child.lstat().st_mode)
              or child.is_symlink()
              or child.stat().st_size != 0
              for child in children
          ):
              raise SystemExit("Linux native private binding was not scrubbed")
          PY
          "$release_python" -I scripts/release-evidence-produce-platform.py \
            --source native-linux \
            --output-dir reports/release-producers \
            --report native-linux/package=reports/platform-diagnostics/native-linux-package.json \
            --report native-linux/runtime=reports/platform-diagnostics/native-linux-runtime.json \
            --report native-linux/filesystem=reports/platform-diagnostics/native-linux-filesystem.json \
            --report native-linux/native-postgres-restore=reports/platform-diagnostics/native-linux-native-postgres-restore.json \
            --artifact native-linux/linux-release-profile="$archive"
      - name: Produce typed Windows platform evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-windows-x64' }}
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content compatibility.toml -Raw), '(?m)^product\s*=\s*"([^"]+)"')).Groups[1].Value
          $archive = "dist/windows/worldstream-$version-windows-x64.zip"
          $releasePython = (uv python find 3.14.7).Trim()
          & $releasePython -I scripts/release-platform-diagnostic.py native `
            --source native-windows `
            --release-inventory $env:WORLDSTREAM_RELEASE_INVENTORY `
            --package-report reports/native-windows-package.json `
            --gate-report reports/native-windows-x64.json `
            --runtime-report reports/native-windows-package-runtime.json `
            --native-restore-report reports/native-windows-postgres-restore.json `
            --native-fixture-report reports/native-windows-transfer-seed.json `
            --native-binding-parent "$env:RUNNER_TEMP\worldstream-native-restore-work" `
            --artifact $archive `
            --output-dir reports/platform-diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bindingRoot = Join-Path $env:RUNNER_TEMP 'worldstream-native-restore-work\worldstream-native-platform-binding'
          $bindingFiles = @(Get-ChildItem -LiteralPath $bindingRoot -Force)
          if ($bindingFiles.Count -ne 5 -or @($bindingFiles | Where-Object {
              $_.PSIsContainer `
              -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 `
              -or $_.Length -ne 0
          }).Count -ne 0) {
              throw 'Windows native private binding was not scrubbed'
          }
          & $releasePython -I scripts/release-evidence-produce-platform.py `
            --source native-windows `
            --output-dir reports/release-producers `
            --report native-windows/package=reports/platform-diagnostics/native-windows-package.json `
            --report native-windows/runtime=reports/platform-diagnostics/native-windows-runtime.json `
            --report native-windows/acl-or-reparse=reports/platform-diagnostics/native-windows-acl-or-reparse.json `
            --report native-windows/native-postgres-restore=reports/platform-diagnostics/native-windows-native-postgres-restore.json `
            --artifact native-windows/windows-release-profile=$archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Produce typed OCI platform evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'oci-linux-amd64' }}
        shell: bash
        run: |
          set -euo pipefail
          release_python="$(uv python find 3.14.7)"
          version=$("$release_python" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          artifact="dist/worldstream-${version}-oci-linux-amd64.oci.tar"
          "$release_python" -I scripts/release-platform-diagnostic.py oci \
            --context dist/oci-context \
            --context-report reports/oci-context.json \
            --runtime-report reports/oci-runtime-smoke.json \
            --context-metadata dist/oci-context/oci-metadata.json \
            --artifact "$artifact" \
            --output-dir reports/platform-diagnostics
          "$release_python" -I scripts/release-evidence-produce-platform.py \
            --source oci-linux \
            --output-dir reports/release-producers \
            --report oci-linux/oci=reports/platform-diagnostics/oci-linux-oci.json \
            --artifact oci-linux/oci-release-profile="$artifact"
      - name: Upload platform gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-gate-${{ matrix.cell }}
          path: reports/${{ matrix.cell }}.json
          if-no-files-found: warn
      - name: Upload Linux release archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-linux-x86_64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-native-linux
          path: dist/linux/*
          if-no-files-found: error
      - name: Upload Linux package identity report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-linux-x86_64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-package-report
          path: reports/native-linux-package.json
          if-no-files-found: error
      - name: Upload Windows release archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'native-windows-x64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-native-windows
          path: dist/windows/*
          if-no-files-found: error
      - name: Upload OCI release image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'oci-linux-amd64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-oci-linux-amd64
          path: dist/worldstream-*-oci-linux-amd64.oci.tar
          if-no-files-found: error
      - name: Upload OCI release evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' && matrix.platform == 'oci-linux-amd64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-oci-evidence
          path: |
            reports/oci-context.json
            reports/oci-runtime-smoke.json
          if-no-files-found: error
      - name: Upload typed platform release producers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-producer-${{ matrix.cell }}
          path: |
            reports/release-producers/
            reports/platform-diagnostics/
            reports/native-*-package-runtime.json
            reports/native-*-postgres-restore.json
            reports/native-*-transfer-seed.json
            reports/telemetry-https.json
          if-no-files-found: error

  macos-source:
    name: macOS source quickstart (${{ matrix.architecture }})
    needs: release-clock
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python
        run: uv python install 3.14.7
      - name: Install exact path-safe Chrome for Testing
        env:
          MACOS_SOURCE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p reports
          case "$MACOS_SOURCE_ARCHITECTURE" in
            arm64)
              browser_platform=mac-arm64
              archive_sha256=ef5d61434f13d9d2d9bdc7c9ab4bff92225979e196458cf846640862b25f127d
              archive_size=98034515
              binary_sha256=4e0c165ef2f0d7265fb1e6b3df2d03d1d6581fb72cdfcebeac19c09760571df6
              binary_size=167333040
              ;;
            x86_64)
              browser_platform=mac-x64
              archive_sha256=a50c716727adf9e4af5b8861d19da23b672b4687a0d631ec4beebb3009d6db97
              archive_size=102893170
              binary_sha256=49b6e6bdc4a9a14a160a2fcb08576ec3acef1d360cfa61bdc79a400a27a16d99
              binary_size=182459908
              ;;
            *) exit 2 ;;
          esac
          browser_version=152.0.7977.54
          browser_url="https://storage.googleapis.com/chrome-for-testing-public/${browser_version}/${browser_platform}/chrome-headless-shell-${browser_platform}.zip"
          browser_archive="$RUNNER_TEMP/worldstream-chrome-for-testing.zip"
          browser_install="$RUNNER_TEMP/worldstream-chrome-for-testing"
          test ! -e "$browser_archive" && test ! -e "$browser_install"
          curl --fail --location --proto '=https' --tlsv1.2 --max-filesize 110000000 \
            "$browser_url" --output "$browser_archive"
          uv run --python 3.14.7 --no-project python scripts/install-pinned-browser.py \
            --archive "$browser_archive" \
            --archive-size "$archive_size" \
            --archive-sha256 "$archive_sha256" \
            --output "$browser_install" \
            --binary-relative "chrome-headless-shell-${browser_platform}/chrome-headless-shell" \
            --binary-size "$binary_size" \
            --binary-sha256 "$binary_sha256" \
            > reports/pinned-browser-install.json
          {
            echo "WORLDSTREAM_PINNED_BROWSER=$browser_install/chrome-headless-shell-${browser_platform}/chrome-headless-shell"
            echo "WORLDSTREAM_PINNED_BROWSER_VERSION=$browser_version"
            echo "WORLDSTREAM_PINNED_BROWSER_SHA256=$binary_sha256"
            echo "WORLDSTREAM_PINNED_BROWSER_SIZE=$binary_size"
            echo "WORLDSTREAM_PINNED_BROWSER_ARCHIVE_URL=$browser_url"
            echo "WORLDSTREAM_PINNED_BROWSER_ARCHIVE_SHA256=$archive_sha256"
            echo "WORLDSTREAM_PINNED_BROWSER_ARCHIVE_SIZE=$archive_size"
          } >> "$GITHUB_ENV"
      - name: Run source-only quickstart
        env:
          MACOS_SOURCE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MACOS_SOURCE_ARCHITECTURE"
          mkdir -p reports
          scripts/macos-source-quickstart.sh \
            --browser "$WORLDSTREAM_PINNED_BROWSER" \
            --browser-version "$WORLDSTREAM_PINNED_BROWSER_VERSION" \
            --browser-sha256 "$WORLDSTREAM_PINNED_BROWSER_SHA256" \
            --browser-size-bytes "$WORLDSTREAM_PINNED_BROWSER_SIZE" \
            --browser-archive-url "$WORLDSTREAM_PINNED_BROWSER_ARCHIVE_URL" \
            --browser-archive-sha256 "$WORLDSTREAM_PINNED_BROWSER_ARCHIVE_SHA256" \
            --browser-archive-size-bytes "$WORLDSTREAM_PINNED_BROWSER_ARCHIVE_SIZE" \
            --report "reports/macos-source-${MACOS_SOURCE_ARCHITECTURE}.json"
      - name: Upload architecture-specific macOS source report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-source-raw-${{ matrix.architecture }}
          path: reports/macos-source-${{ matrix.architecture }}.json
          if-no-files-found: error

  macos-source-release:
    name: Typed dual-architecture macOS source evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    needs: [macos-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned evidence Python
        run: uv python install 3.14.7
      - name: Download exact architecture-specific macOS reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-macos-source-raw-*
          merge-multiple: true
          path: reports/macos-source-raw
      - name: Produce typed dual-architecture macOS source evidence
        run: |
          set -euo pipefail
          uv run --python 3.14.7 --no-project python scripts/release-platform-diagnostic.py macos \
            --quickstart-report reports/macos-source-raw/macos-source-arm64.json \
            --quickstart-report reports/macos-source-raw/macos-source-x86_64.json \
            --source-revision "${{ github.sha }}" \
            --artifact-output reports/macos-source-matrix.json \
            --output-dir reports/platform-diagnostics
          uv run --python 3.14.7 --no-project python scripts/release-evidence-produce-platform.py \
            --source macos-source \
            --output-dir reports/release-producers \
            --report macos-source/source-quickstart=reports/platform-diagnostics/macos-source-source-quickstart.json \
            --artifact macos-source/macos-quickstart=reports/macos-source-matrix.json
      - name: Upload typed dual-architecture macOS source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-source-evidence
          path: |
            reports/macos-source-matrix.json
            reports/platform-diagnostics/
            reports/release-producers/
          if-no-files-found: error

  conformance-release:
    name: Typed release conformance producers
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    needs: release-clock
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python and prime locked Rust dependencies
        run: |
          uv python install 3.14.7
          cargo fetch --locked
          command -v docker
          command -v psql
      - name: Produce exact conformance diagnostics
        run: |
          set -euo pipefail
          mkdir -p release-inputs/diagnostics
          uv run --python 3.14.7 --no-project python \
            scripts/manifest-evidence-wave6.py --json \
            > release-inputs/diagnostics/manifest.json
          scripts/soak-smoke.sh \
            --iterations 1 \
            --command-timeout-seconds 600 \
            --max-total-seconds 900 \
            --output release-inputs/diagnostics/sqlite.json
          scripts/postgres-live-evidence.sh \
            --evidence release-inputs/diagnostics/postgres.json
          scripts/postgres-transfer-smoke.sh \
            --build-source \
            --evidence release-inputs/diagnostics/transfer.json
          scripts/postgres-native-restore-smoke.sh \
            --evidence release-inputs/diagnostics/postgres-restore.json
      - name: Validate and type conformance producers
        run: |
          set -euo pipefail
          uv run --python 3.14.7 --no-project python scripts/release-evidence-produce-conformance.py \
            --output-dir release-inputs/producers \
            --artifact-dir release-inputs/artifacts \
            --manifest-report release-inputs/diagnostics/manifest.json \
            --sqlite-report release-inputs/diagnostics/sqlite.json \
            --postgres-report release-inputs/diagnostics/postgres.json \
            --transfer-report release-inputs/diagnostics/transfer.json \
            --postgres-restore-report release-inputs/diagnostics/postgres-restore.json
      - name: Upload typed conformance producers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-conformance-producers
          path: release-inputs/
          if-no-files-found: error

  packaged-backend-release:
    name: Fresh packaged Counter and absent-Broker backend parity
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    needs: [release-clock, native]
    environment: worldstream-release
    runs-on: [self-hosted, linux, x64, ubuntu-24.04-x86_64-ext4-4vcpu-8gib-local-ssd]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python and SDK dependencies
        run: |
          uv python install 3.14.7
          uv sync --project sdk/python --locked
          command -v docker
          command -v psql
      - name: Install exact path-safe Chrome for Testing
        run: |
          set -euo pipefail
          mkdir -p reports
          browser_version=152.0.7977.54
          browser_url="https://storage.googleapis.com/chrome-for-testing-public/${browser_version}/linux64/chrome-headless-shell-linux64.zip"
          browser_archive="$RUNNER_TEMP/worldstream-chrome-for-testing.zip"
          browser_install="$RUNNER_TEMP/worldstream-chrome-for-testing"
          test ! -e "$browser_archive" && test ! -e "$browser_install"
          curl --fail --location --proto '=https' --tlsv1.2 --max-filesize 120000000 \
            "$browser_url" --output "$browser_archive"
          uv run --python 3.14.7 --no-project python scripts/install-pinned-browser.py \
            --archive "$browser_archive" \
            --archive-size 119570919 \
            --archive-sha256 11cedb5568cd374a76eb738e40bd434cd0c9956820fb406b8bd9edca53428d3e \
            --output "$browser_install" \
            --binary-relative chrome-headless-shell-linux64/chrome-headless-shell \
            --binary-size 195435856 \
            --binary-sha256 8a3f72f9676736c45e94ae3279b4e2e6a1e323187f9a5e73c9a760e8cc1296ea \
            > reports/pinned-browser-install.json
          {
            echo "WORLDSTREAM_PINNED_BROWSER=$browser_install/chrome-headless-shell-linux64/chrome-headless-shell"
            echo "WORLDSTREAM_PINNED_BROWSER_VERSION=$browser_version"
            echo "WORLDSTREAM_PINNED_BROWSER_SHA256=8a3f72f9676736c45e94ae3279b4e2e6a1e323187f9a5e73c9a760e8cc1296ea"
            echo "WORLDSTREAM_PINNED_BROWSER_SIZE=195435856"
            echo "WORLDSTREAM_PINNED_BROWSER_ARCHIVE_URL=$browser_url"
            echo "WORLDSTREAM_PINNED_BROWSER_ARCHIVE_SHA256=11cedb5568cd374a76eb738e40bd434cd0c9956820fb406b8bd9edca53428d3e"
            echo "WORLDSTREAM_PINNED_BROWSER_ARCHIVE_SIZE=119570919"
          } >> "$GITHUB_ENV"
      - name: Download fresh Linux release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-native-linux
          path: package-input
      - name: Download fresh Linux package report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-package-report
          path: package-input
      - name: Run package-bound browser Heist plus six backend cells
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(package-input/worldstream-*-linux-x86_64.tar.gz)
          reports=(package-input/native-linux-package.json)
          [[ "${#archives[@]}" -eq 1 && "${#reports[@]}" -eq 1 ]]
          uv run --python 3.14.7 --project sdk/python --locked python \
            scripts/postgres-packaged-acceptance.py \
            --package-archive "${archives[0]}" \
            --package-report "${reports[0]}" \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --browser "$WORLDSTREAM_PINNED_BROWSER" \
            --browser-version "$WORLDSTREAM_PINNED_BROWSER_VERSION" \
            --browser-sha256 "$WORLDSTREAM_PINNED_BROWSER_SHA256" \
            --browser-size-bytes "$WORLDSTREAM_PINNED_BROWSER_SIZE" \
            --browser-archive-url "$WORLDSTREAM_PINNED_BROWSER_ARCHIVE_URL" \
            --browser-archive-sha256 "$WORLDSTREAM_PINNED_BROWSER_ARCHIVE_SHA256" \
            --browser-archive-size-bytes "$WORLDSTREAM_PINNED_BROWSER_ARCHIVE_SIZE" \
            --report reports/postgres-packaged-acceptance.json
      - name: Upload package-bound backend parity report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packaged-backend-parity
          path: reports/postgres-packaged-acceptance.json
          if-no-files-found: error

  failure-soak-release:
    name: Packaged Linux SIGKILL and one-hour soak evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    needs: [release-clock, native, packaged-backend-release]
    environment: worldstream-release
    runs-on: [self-hosted, linux, x64, ubuntu-24.04-x86_64-ext4-4vcpu-8gib-local-ssd]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python and SDK dependencies
        run: |
          uv python install 3.14.7
          uv sync --project sdk/python --locked
          command -v docker
          command -v psql
      - name: Download fresh Linux release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-native-linux
          path: package-input
      - name: Download fresh Linux package report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-package-report
          path: package-input
      - name: Download exact package-bound backend acceptance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packaged-backend-parity
          path: package-acceptance
      - id: packaged_linux
        name: Verify and extract the unique packaged daemon
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(package-input/worldstream-*-linux-x86_64.tar.gz)
          reports=(package-input/native-linux-package.json)
          [[ "${#archives[@]}" -eq 1 && "${#reports[@]}" -eq 1 ]]
          scripts/verify-release.sh "${archives[0]}" \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY"
          mkdir -p reports package-extracted
          daemon=package-extracted/worldstreamd
          uv run --python 3.14.7 --project sdk/python --locked python \
            scripts/release-package-extract.py \
            --archive "${archives[0]}" \
            --package-report "${reports[0]}" \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --output "$daemon" \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json \
            > reports/package-extraction.json
          [[ -f "$daemon" && ! -L "$daemon" && -x "$daemon" ]]
          printf 'archive=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"
          printf 'report=%s\n' "${reports[0]}" >> "$GITHUB_OUTPUT"
          printf 'daemon=%s\n' "$daemon" >> "$GITHUB_OUTPUT"
      - id: kill_point
        name: Run the exact packaged 36-cell SIGKILL matrix
        continue-on-error: true
        run: |
          scripts/kill-point-smoke.sh \
            --daemon-bin '${{ steps.packaged_linux.outputs.daemon }}' \
            --package-archive '${{ steps.packaged_linux.outputs.archive }}' \
            --package-report '${{ steps.packaged_linux.outputs.report }}' \
            --output reports/kill-point-evidence.json \
            --log-output reports/kill-point.log
      - id: one_hour_soak
        name: Run the exact packaged 3600-second process workload
        continue-on-error: true
        run: |
          scripts/daemon-transition-soak.sh \
            --one-hour \
            --daemon-bin '${{ steps.packaged_linux.outputs.daemon }}' \
            --package-archive '${{ steps.packaged_linux.outputs.archive }}' \
            --package-report '${{ steps.packaged_linux.outputs.report }}' \
            --packaged-acceptance-report package-acceptance/postgres-packaged-acceptance.json \
            --output reports/daemon-transition-soak.json \
            --log-output reports/daemon-transition-soak.log
      - name: Validate and type packaged failure/soak evidence
        if: ${{ steps.kill_point.outcome == 'success' && steps.one_hour_soak.outcome == 'success' }}
        run: |
          uv run --python 3.14.7 --project sdk/python --locked python \
            scripts/release-evidence-produce-failure-soak.py \
            --output release-inputs/failure/producers/failure-soak.json \
            --artifact-output release-inputs/failure/artifacts/failure-soak.json \
            --soak-report reports/daemon-transition-soak.json \
            --kill-point-report reports/kill-point-evidence.json \
            --package-archive '${{ steps.packaged_linux.outputs.archive }}' \
            --package-report '${{ steps.packaged_linux.outputs.report }}' \
            --daemon-bin '${{ steps.packaged_linux.outputs.daemon }}' \
            --packaged-acceptance-report package-acceptance/postgres-packaged-acceptance.json \
            --retained-log reports/kill-point.log \
            --retained-log reports/daemon-transition-soak.log \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json
      - name: Upload packaged failure/soak diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-failure-soak-diagnostics
          path: reports/
          if-no-files-found: warn
      - name: Upload typed packaged failure/soak producer
        if: ${{ steps.kill_point.outcome == 'success' && steps.one_hour_soak.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-failure-soak
          path: release-inputs/failure/
          if-no-files-found: error
      - name: Enforce successful typed packaged failure/soak evidence
        if: ${{ always() }}
        run: |
          test '${{ steps.kill_point.outcome }}' = success
          test '${{ steps.one_hour_soak.outcome }}' = success
          test -s release-inputs/failure/producers/failure-soak.json
          test -s release-inputs/failure/artifacts/failure-soak.json

  reference-performance-release:
    name: Frozen-host packaged reference performance evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    needs: [release-clock, native, packaged-backend-release, failure-soak-release]
    environment: worldstream-release
    runs-on: [self-hosted, linux, x64, ubuntu-24.04-x86_64-ext4-4vcpu-8gib-local-ssd]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python and SDK dependencies
        run: |
          uv python install 3.14.7
          uv sync --project sdk/python --locked
      - name: Build the source-bound snapshot-tail fixture generator
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
          cargo build --locked --release -p worldstream-sqlite \
            --example reference_snapshot_tail_fixture
          fixture=target/release/examples/reference_snapshot_tail_fixture
          [[ -f "$fixture" && ! -L "$fixture" && -x "$fixture" ]]
          printf 'snapshot_fixture=%s\n' "$(realpath "$fixture")" >> "$GITHUB_ENV"
      - name: Download fresh Linux release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-native-linux
          path: package-input
      - name: Download fresh Linux package report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-package-report
          path: package-input
      - name: Download exact package-bound backend acceptance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packaged-backend-parity
          path: package-acceptance
      - name: Download exact failure and one-hour process-soak diagnostics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-failure-soak-diagnostics
          path: process-input
      - name: Verify and extract the unique packaged reference daemon
        id: reference_package
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(package-input/worldstream-*-linux-x86_64.tar.gz)
          reports=(package-input/native-linux-package.json)
          acceptances=(package-acceptance/postgres-packaged-acceptance.json)
          soaks=(process-input/daemon-transition-soak.json)
          kills=(process-input/kill-point-evidence.json)
          [[ "${#archives[@]}" -eq 1 && "${#reports[@]}" -eq 1 ]]
          [[ "${#acceptances[@]}" -eq 1 && "${#soaks[@]}" -eq 1 && "${#kills[@]}" -eq 1 ]]
          mkdir -p package-extracted reports reference-inputs/normalized
          daemon=package-extracted/worldstreamd
          sdk_root=package-extracted/sdk-python
          uv run --python 3.14.7 --project sdk/python --locked python \
            scripts/release-package-extract.py \
            --archive "${archives[0]}" \
            --package-report "${reports[0]}" \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --output "$daemon" \
            --sdk-output "$sdk_root" \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json \
            > reports/reference-package-extraction.json
          [[ -f "$daemon" && ! -L "$daemon" && -x "$daemon" ]]
          [[ -f "$sdk_root/pyproject.toml" && ! -L "$sdk_root/pyproject.toml" ]]
          [[ -f "$sdk_root/uv.lock" && ! -L "$sdk_root/uv.lock" ]]
          [[ -f "$sdk_root/src/worldstream_sdk/client.py" && ! -L "$sdk_root/src/worldstream_sdk/client.py" ]]
          uv sync --python 3.14.7 --project "$sdk_root" --locked
          printf 'archive=%s\n' "${archives[0]}" >> "$GITHUB_OUTPUT"
          printf 'report=%s\n' "${reports[0]}" >> "$GITHUB_OUTPUT"
          printf 'acceptance=%s\n' "${acceptances[0]}" >> "$GITHUB_OUTPUT"
          printf 'soak=%s\n' "${soaks[0]}" >> "$GITHUB_OUTPUT"
          printf 'kill=%s\n' "${kills[0]}" >> "$GITHUB_OUTPUT"
          printf 'daemon=%s\n' "$daemon" >> "$GITHUB_OUTPUT"
          printf 'sdk=%s\n' "$sdk_root" >> "$GITHUB_OUTPUT"
      - name: Run the exact frozen packaged reference-target workload
        run: |
          set -euo pipefail
          export PYTHONPATH='${{ steps.reference_package.outputs.sdk }}/src'
          uv run --python 3.14.7 --project '${{ steps.reference_package.outputs.sdk }}' --locked python \
            scripts/reference-target-workload.py \
            --output reference-inputs/reference-target.json \
            --daemon-bin '${{ steps.reference_package.outputs.daemon }}' \
            --package-archive '${{ steps.reference_package.outputs.archive }}' \
            --package-report '${{ steps.reference_package.outputs.report }}' \
            --packaged-acceptance-report '${{ steps.reference_package.outputs.acceptance }}' \
            --packaged-sdk-root '${{ steps.reference_package.outputs.sdk }}' \
            --soak-report '${{ steps.reference_package.outputs.soak }}' \
            --kill-point-report '${{ steps.reference_package.outputs.kill }}' \
            --snapshot-fixture-bin "$snapshot_fixture" \
            --snapshot-fixture-report reference-inputs/snapshot-tail-fixture.json \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json
      - name: Project exact raw measurements into six normalized reports
        run: |
          uv run --python 3.14.7 --project sdk/python --locked python \
            scripts/reference-evidence-project.py \
            --packaged-acceptance-report '${{ steps.reference_package.outputs.acceptance }}' \
            --soak-report '${{ steps.reference_package.outputs.soak }}' \
            --kill-point-report '${{ steps.reference_package.outputs.kill }}' \
            --target-report reference-inputs/reference-target.json \
            --package-archive '${{ steps.reference_package.outputs.archive }}' \
            --package-report '${{ steps.reference_package.outputs.report }}' \
            --daemon-bin '${{ steps.reference_package.outputs.daemon }}' \
            --snapshot-fixture-bin "$snapshot_fixture" \
            --snapshot-fixture-report reference-inputs/snapshot-tail-fixture.json \
            --output-dir reference-inputs/normalized \
            --aggregate-report reference-inputs/reference-performance.json \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json
      - name: Produce typed measured non-SLA reference evidence
        run: |
          uv run --python 3.14.7 --project sdk/python --locked python \
            scripts/release-evidence-produce-reference.py \
            --output release-inputs/reference/producers/reference-performance.json \
            --artifact-output release-inputs/reference/artifacts/reference-performance.json \
            --report reference-inputs/reference-performance.json \
            --counter-report reference-inputs/normalized/counter.json \
            --heist-report reference-inputs/normalized/heist.json \
            --sqlite-report reference-inputs/normalized/sqlite.json \
            --postgres-report reference-inputs/normalized/postgres.json \
            --soak-report reference-inputs/normalized/soak.json \
            --target-report reference-inputs/normalized/target.json \
            --package-archive '${{ steps.reference_package.outputs.archive }}' \
            --package-report '${{ steps.reference_package.outputs.report }}' \
            --daemon-bin '${{ steps.reference_package.outputs.daemon }}' \
            --snapshot-fixture-bin "$snapshot_fixture" \
            --snapshot-fixture-report reference-inputs/snapshot-tail-fixture.json \
            --packaged-acceptance-report '${{ steps.reference_package.outputs.acceptance }}' \
            --raw-soak-report '${{ steps.reference_package.outputs.soak }}' \
            --kill-point-report '${{ steps.reference_package.outputs.kill }}' \
            --raw-target-report reference-inputs/reference-target.json \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json
      - name: Upload reference projection diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-reference-performance-diagnostics
          path: |
            reports/reference-package-extraction.json
            reference-inputs/
          if-no-files-found: warn
      - name: Upload typed packaged reference-performance producer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-reference-performance
          path: release-inputs/reference/
          if-no-files-found: error

  release-evidence:
    name: Unsigned release subject aggregation
    needs: [release-clock, fast, native, macos-source-release, conformance-release, packaged-backend-release, failure-soak-release, reference-performance-release]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      inventory_sha256: ${{ steps.unsigned_inventory.outputs.inventory_sha256 }}
      inventory_size_bytes: ${{ steps.unsigned_inventory.outputs.inventory_size_bytes }}
      layout_sha256: ${{ steps.unsigned_inventory.outputs.layout_sha256 }}
      product_version: ${{ steps.unsigned_inventory.outputs.product_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORLDSTREAM_RELEASE_INPUT: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm and build portable release inputs
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          pnpm pack:build
          pnpm ui:build
      - name: Install pinned gate Python
        run: |
          uv python install 3.14.7
          uv sync --project sdk/python --locked
          release_python="$(uv python find 3.14.7)"
          test "$("$release_python" -I -c 'import platform; print(platform.python_version())')" = 3.14.7
          printf 'WORLDSTREAM_RELEASE_PYTHON=%s\n' "$release_python" >> "$GITHUB_ENV"
      - name: Build and verify source archive from the clean checkout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          source_payload="$RUNNER_TEMP/worldstream-clean-source-payload"
          source_report="$RUNNER_TEMP/worldstream-clean-source-package.json"
          source_environment="$RUNNER_TEMP/worldstream-source-build-environment.json"
          mkdir -p "$source_payload"
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/package.py capture-build-environment \
            --target source \
            --output "$source_environment"
          SOURCE_DATE_EPOCH=0 scripts/package-release.sh \
            --target source \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --source-dir . \
            --build-environment "$source_environment" \
            --output "$source_payload" \
            --report "$source_report"
          version=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          scripts/verify-release.sh \
            "$source_payload/worldstream-${version}-source.tar.gz" \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY"
      - name: Download native and OCI release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-native-*
          merge-multiple: true
          path: release-inputs/payload
      - name: Download OCI release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-oci-linux-amd64
          path: release-inputs/payload
      - name: Download OCI release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-oci-evidence
          path: release-inputs/oci-evidence
      - name: Download macOS source-only evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos-source-evidence
          path: release-inputs/macos
      - name: Download typed hosted platform producers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-platform-producer-*
          merge-multiple: true
          path: release-inputs/platform-producers
      - name: Download typed conformance producers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-conformance-producers
          path: release-inputs/conformance
      - name: Download typed packaged failure/soak producer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-failure-soak
          path: release-inputs/failure
      - name: Download typed packaged reference-performance producer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-reference-performance
          path: release-inputs/reference
      - name: Add the clean-checkout source archive to the payload set
        run: |
          mkdir -p release-inputs/payload reports
          version=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          source_archive="$RUNNER_TEMP/worldstream-clean-source-payload/worldstream-${version}-source.tar.gz"
          test -f "$source_archive" && test ! -L "$source_archive"
          cp --no-clobber "$source_archive" release-inputs/payload/
      - name: Build and bind the eleven deterministic portable release subjects
        run: |
          set -euo pipefail
          version=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          mkdir release-inputs/release-metadata
          cp --no-clobber compatibility.json compatibility.toml release-inputs/release-metadata/
          mkdir -p release-inputs/portable/a202 release-inputs/portable/documentation
          cp --recursive --no-clobber crates/worldstream-a202-adapter release-inputs/portable/a202/crate
          cp --recursive --no-clobber interop/a202-peer-v1 release-inputs/portable/a202/interop-kit
          cp --recursive --no-clobber docs release-inputs/portable/documentation/docs
          cp --recursive --no-clobber qualification/outside-adopter-v1 release-inputs/portable/documentation/outside-adopter-kit
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/starter-release-subjects.py build \
            --version "$version" \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --output-dir release-inputs/starter-subjects \
            --compatibility-json compatibility.json \
            --subject worldstream-a202-adapter=release-inputs/portable/a202 \
            --subject worldstream-deterministic-agents=crates/worldstream-negotiate-oracle/fixtures/corpus-v1.json \
            --subject worldstream-documentation=release-inputs/portable/documentation \
            --subject worldstream-examples=examples \
            --subject worldstream-licenses=licenses \
            --subject worldstream-negotiate-bundle=packs/negotiate/releases/0.1.0/worldstream-negotiate-9033a1aa10ca37c301660b7427d79c4e71d7af59006bc7d51edc4b470c8c2db5.wspack \
            --subject worldstream-negotiate-evidence-verifier=crates/worldstream-negotiate-evidence \
            --subject worldstream-pack-toolchain=sdk/typescript-pack/packages/pack-cli/dist \
            --subject worldstream-participant-console=web/console/dist \
            --subject worldstream-release-metadata=release-inputs/release-metadata \
            --subject worldstream-typescript-pack-sdk=sdk/typescript-pack/packages/pack-sdk/dist
          cp --no-clobber release-inputs/starter-subjects/* release-inputs/payload/
      - name: Collect platform gate reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: platform-gate-*
          merge-multiple: true
          path: release-inputs/platform
      - name: Produce typed release evidence source reports
        run: |
          set -euo pipefail
          mkdir -p \
            release-inputs/security/diagnostics \
            release-inputs/security/producers \
            release-inputs/source-reports
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/release-platform-diagnostic.py security \
            --linux-gate-report release-inputs/platform/native-linux-x86_64.json \
            --windows-gate-report release-inputs/platform/native-windows-x64.json \
            --linux-runtime-report release-inputs/platform-producers/native-linux-package-runtime.json \
            --windows-runtime-report release-inputs/platform-producers/native-windows-package-runtime.json \
            --https-report release-inputs/platform-producers/telemetry-https.json \
            --artifact-output release-inputs/security/security-observability.json \
            --output-dir release-inputs/security/diagnostics
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/release-evidence-produce-platform.py \
            --source security-observability \
            --output-dir release-inputs/security/producers \
            --report security-observability/config-redaction-observability=release-inputs/security/diagnostics/security-observability-config-redaction-observability.json \
            --report security-observability/security=release-inputs/security/diagnostics/security-observability-security.json \
            --artifact security-observability/security-observability=release-inputs/security/security-observability.json

          version=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          linux_archive="release-inputs/payload/worldstream-${version}-linux-x86_64.tar.gz"
          windows_archive="release-inputs/payload/worldstream-${version}-windows-x64.zip"
          oci_archive="release-inputs/payload/worldstream-${version}-oci-linux-amd64.oci.tar"
          negotiate_bundle="release-inputs/payload/worldstream-${version}-negotiate.wspack"
          mkdir -p release-inputs/runtime-packs/released-linux
          tar -xzf "$linux_archive" \
            -C release-inputs/runtime-packs/released-linux \
            --strip-components=1
          release-inputs/runtime-packs/released-linux/bin/worldstreamctl \
            pack prove "$negotiate_bundle" --json \
            > release-inputs/runtime-packs/negotiate-pack-proof.json
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/release-evidence-produce-runtime-packs.py \
            --component-only \
            --output-dir release-inputs/runtime-packs/producers \
            --bundle "$negotiate_bundle" \
            --pack-proof release-inputs/runtime-packs/negotiate-pack-proof.json \
            --linux-archive "$linux_archive" \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json
          producer_status=0
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/release-evidence-produce.py \
            --output-dir release-inputs/source-reports \
            --producer manifest-contract=release-inputs/conformance/producers/manifest-contract.json \
            --producer sqlite-conformance=release-inputs/conformance/producers/sqlite-conformance.json \
            --producer postgres-conformance=release-inputs/conformance/producers/postgres-conformance.json \
            --producer migration-history=release-inputs/conformance/producers/migration-history.json \
            --producer transfer=release-inputs/conformance/producers/transfer.json \
            --producer restore=release-inputs/conformance/producers/restore.json \
            --producer native-linux=release-inputs/platform-producers/release-producers/native-linux-release-profile.json \
            --producer native-windows=release-inputs/platform-producers/release-producers/native-windows-release-profile.json \
            --producer oci-linux=release-inputs/platform-producers/release-producers/oci-linux-amd64-release-profile.json \
            --producer macos-source=release-inputs/macos/release-producers/macos-source-quickstart.json \
            --producer security-observability=release-inputs/security/producers/config-secrets-probes-observability-security.json \
            --producer failure-soak=release-inputs/failure/producers/failure-soak.json \
            --producer reference-performance=release-inputs/reference/producers/reference-performance.json \
            --producer pack-component-conformance=release-inputs/runtime-packs/producers/pack-component-conformance.json \
            --missing negotiate-policy=exact-negotiate-oracle-privacy-a202-producer-not-uploaded \
            --missing negotiate-sqlite-restart=released-artifact-sqlite-restart-producer-not-uploaded \
            --missing negotiate-postgres-restart=released-artifact-postgresql-restart-producer-not-uploaded \
            --missing supply-chain=supply-chain-pre-sign-typed-producer-not-uploaded \
            --artifact manifest-contract/compatibility-pair=release-inputs/conformance/artifacts/manifest-contract.json \
            --artifact sqlite-conformance/sqlite-conformance-result=release-inputs/conformance/artifacts/sqlite-conformance.json \
            --artifact postgres-conformance/postgres-conformance-result=release-inputs/conformance/artifacts/postgres-conformance.json \
            --artifact migration-history/migration-history-result=release-inputs/conformance/artifacts/migration-history.json \
            --artifact transfer/transfer-result=release-inputs/conformance/artifacts/transfer.json \
            --artifact restore/restore-result=release-inputs/conformance/artifacts/restore.json \
            --artifact native-linux/linux-release-profile="$linux_archive" \
            --artifact native-windows/windows-release-profile="$windows_archive" \
            --artifact oci-linux/oci-release-profile="$oci_archive" \
            --artifact macos-source/macos-quickstart=release-inputs/macos/macos-source-matrix.json \
            --artifact security-observability/security-observability=release-inputs/security/security-observability.json \
            --artifact failure-soak/failure-soak=release-inputs/failure/artifacts/failure-soak.json \
            --artifact failure-soak/linux-release-profile="$linux_archive" \
            --artifact reference-performance/reference-performance=release-inputs/reference/artifacts/reference-performance.json \
            --artifact reference-performance/linux-release-profile="$linux_archive" \
            --artifact pack-component-conformance/negotiate-bundle="$negotiate_bundle" \
            --artifact pack-component-conformance/negotiate-conformance-evidence=packs/negotiate/evidence/conformance-v1.json \
            || producer_status=$?
          printf 'typed producer adapter exit=%s; supply-chain plus three Negotiate policy/restart producers remain explicitly unavailable in this phase\n' "$producer_status"
      - name: Produce and verify unsigned subject inventory, SPDX SBOM, and SLSA provenance
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/release-supply-chain.py \
            --prepare-unsigned \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --release-dir dist \
            --payload-dir release-inputs/payload \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json \
            --source manifest-contract=release-inputs/source-reports/manifest-syntax-parity.json \
            --source sqlite-conformance=release-inputs/source-reports/sqlite-conformance-migration-backup-restore-crash.json \
            --source postgres-conformance=release-inputs/source-reports/postgresql-direct-and-transaction-pooler-conformance.json \
            --source migration-history=release-inputs/source-reports/all-prior-forward-migrations-both-backends.json \
            --source transfer=release-inputs/source-reports/sqlite-postgresql-transfer-byte-parity-and-epoch-fencing.json \
            --source restore=release-inputs/source-reports/backend-native-isolated-restore-and-bounded-semantic-verifier.json \
            --source native-linux=release-inputs/source-reports/native-linux-release-profile.json \
            --source native-windows=release-inputs/source-reports/native-windows-release-profile.json \
            --source oci-linux=release-inputs/source-reports/oci-linux-amd64-release-profile.json \
            --source macos-source=release-inputs/source-reports/macos-source-quickstart.json \
            --source security-observability=release-inputs/source-reports/config-secrets-probes-observability-security.json \
            --source failure-soak=release-inputs/source-reports/failure-fuzz-resource-and-one-hour-sqlite-soak.json \
            --source reference-performance=release-inputs/source-reports/reference-performance-per-backend.json \
            --source pack-component-conformance=release-inputs/source-reports/worldstream-negotiate-evidence.json \
            --source negotiate-policy=release-inputs/source-reports/negotiate-oracle-a202-and-privacy.json \
            --source negotiate-sqlite-restart=release-inputs/source-reports/negotiate-released-artifact-sqlite-restart-replay.json \
            --source negotiate-postgres-restart=release-inputs/source-reports/negotiate-released-artifact-postgresql-restart-replay.json
      - id: unsigned_inventory
        name: Bind exact unsigned signing inputs
        run: |
          set -euo pipefail
          inventory=dist/supply-chain/subject-inventory.json
          test -f "$inventory" && test ! -L "$inventory"
          test ! -e dist/supply-chain/subject-inventory.bundle.json
          test ! -e dist/sigstore.bundle.json
          test "$(find dist -type f | wc -l)" -eq 36
          test "$(find dist/supply-chain/subjects -maxdepth 1 -type f | wc -l)" -eq 17
          test "$(wc -l < dist/SHA256SUMS)" -eq 32
          (cd dist && sha256sum --strict --check SHA256SUMS)
          version=$("$WORLDSTREAM_RELEASE_PYTHON" -I -c 'import tomllib; print(tomllib.load(open("compatibility.toml", "rb"))["contracts"]["product"])')
          printf 'inventory_sha256=%s\n' "$(sha256sum "$inventory" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'inventory_size_bytes=%s\n' "$(stat -c %s "$inventory")" >> "$GITHUB_OUTPUT"
          printf 'layout_sha256=%s\n' "$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'product_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Upload exact unsigned subject aggregation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned-subjects-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release-signing:
    name: Sign exact pre-sign subject inventory
    needs: [release-clock, release-evidence]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    environment: worldstream-release
    permissions:
      contents: read
      id-token: write
    outputs:
      bundle_sha256: ${{ steps.sign_inventory.outputs.bundle_sha256 }}
      bundle_size_bytes: ${{ steps.sign_inventory.outputs.bundle_size_bytes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COSIGN_CERTIFICATE_IDENTITY: https://github.com/imom39a/worldstream/.github/workflows/compatibility-gates.yml@refs/heads/main
      COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
      EXPECTED_INVENTORY_SHA256: ${{ needs.release-evidence.outputs.inventory_sha256 }}
      EXPECTED_INVENTORY_SIZE_BYTES: ${{ needs.release-evidence.outputs.inventory_size_bytes }}
      EXPECTED_LAYOUT_SHA256: ${{ needs.release-evidence.outputs.layout_sha256 }}
    steps:
      - name: Download exact unsigned subject aggregation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned-subjects-${{ github.sha }}-${{ github.run_attempt }}
          path: signing-input
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - id: sign_inventory
        name: Verify exact inventory and sign only its bytes
        shell: bash
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          inventory=signing-input/supply-chain/subject-inventory.json
          test -f "$inventory" && test ! -L "$inventory"
          test ! -e signing-input/supply-chain/subject-inventory.bundle.json
          test ! -e signing-input/sigstore.bundle.json
          test "$(find signing-input -type l | wc -l)" -eq 0
          test "$(find signing-input -type f | wc -l)" -eq 36
          test "$(find signing-input/supply-chain/subjects -maxdepth 1 -type f | wc -l)" -eq 17
          test "$(wc -l < signing-input/SHA256SUMS)" -eq 32
          test "$(sha256sum "$inventory" | cut -d ' ' -f 1)" = "$EXPECTED_INVENTORY_SHA256"
          test "$(stat -c %s "$inventory")" = "$EXPECTED_INVENTORY_SIZE_BYTES"
          test "$(cd signing-input && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)" = "$EXPECTED_LAYOUT_SHA256"
          (cd signing-input && sha256sum --strict --check SHA256SUMS)
          test "$COSIGN_CERTIFICATE_IDENTITY" = "https://github.com/imom39a/worldstream/.github/workflows/compatibility-gates.yml@refs/heads/main"
          test "$COSIGN_CERTIFICATE_OIDC_ISSUER" = "https://token.actions.githubusercontent.com"
          mkdir signing-output
          bundle=signing-output/subject-inventory.bundle.json
          cosign sign-blob --yes --bundle "$bundle" "$inventory" >/dev/null
          test -s "$bundle" && test ! -L "$bundle"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            "$inventory" >/dev/null
          test "$(find signing-output -type f | wc -l)" -eq 1
          printf 'bundle_sha256=%s\n' "$(sha256sum "$bundle" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'bundle_size_bytes=%s\n' "$(stat -c %s "$bundle")" >> "$GITHUB_OUTPUT"
      - name: Upload exact subject inventory signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-subject-signature-${{ github.sha }}-${{ github.run_attempt }}
          path: signing-output/subject-inventory.bundle.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release-finalize:
    name: Assemble exact unsigned final manifest
    needs: [release-clock, release-evidence, release-signing]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.final_manifest.outputs.manifest_sha256 }}
      manifest_size_bytes: ${{ steps.final_manifest.outputs.manifest_size_bytes }}
      layout_sha256: ${{ steps.final_manifest.outputs.layout_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COSIGN_CERTIFICATE_IDENTITY: https://github.com/imom39a/worldstream/.github/workflows/compatibility-gates.yml@refs/heads/main
      COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned final-assembly dependencies
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          uv python install 3.14.7
          uv sync --project sdk/python --locked
          release_python="$(uv python find 3.14.7)"
          test "$("$release_python" -I -c 'import platform; print(platform.python_version())')" = 3.14.7
          printf 'WORLDSTREAM_RELEASE_PYTHON=%s\n' "$release_python" >> "$GITHUB_ENV"
      - name: Install pinned cosign for verification only
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download exact unsigned subject aggregation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned-subjects-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - name: Download exact subject inventory signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-subject-signature-${{ github.sha }}-${{ github.run_attempt }}
          path: signed-input
      - name: Bind signed inventory into the final release layout
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          bundle=signed-input/subject-inventory.bundle.json
          test -f "$bundle" && test ! -L "$bundle"
          test "$(find signed-input -type f | wc -l)" -eq 1
          test "$(sha256sum "$bundle" | cut -d ' ' -f 1)" = "${{ needs.release-signing.outputs.bundle_sha256 }}"
          test "$(stat -c %s "$bundle")" = "${{ needs.release-signing.outputs.bundle_size_bytes }}"
          test ! -e dist/supply-chain/subject-inventory.bundle.json
          test ! -e dist/sigstore.bundle.json
          cp --no-clobber "$bundle" dist/supply-chain/subject-inventory.bundle.json
      - name: Verify the signed inventory and produce its typed source report
        run: |
          set -euo pipefail
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/release-supply-chain.py \
            --finalize-signed \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --release-dir dist \
            --producer-output release-inputs/pre-sign/supply-chain-producer.json \
            --source-output release-inputs/source-reports/checksums-signature-sbom-provenance.json \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json
      - name: Collect exact release evidence sources
        run: |
          set -euo pipefail
          "$WORLDSTREAM_RELEASE_PYTHON" -I scripts/release-evidence-collect.py \
            --output-dir release-inputs/reports \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json \
            --source manifest-contract=dist/supply-chain/subjects/manifest-syntax-parity.json \
            --source sqlite-conformance=dist/supply-chain/subjects/sqlite-conformance-migration-backup-restore-crash.json \
            --source postgres-conformance=dist/supply-chain/subjects/postgresql-direct-and-transaction-pooler-conformance.json \
            --source migration-history=dist/supply-chain/subjects/all-prior-forward-migrations-both-backends.json \
            --source transfer=dist/supply-chain/subjects/sqlite-postgresql-transfer-byte-parity-and-epoch-fencing.json \
            --source restore=dist/supply-chain/subjects/backend-native-isolated-restore-and-bounded-semantic-verifier.json \
            --source native-linux=dist/supply-chain/subjects/native-linux-release-profile.json \
            --source native-windows=dist/supply-chain/subjects/native-windows-release-profile.json \
            --source oci-linux=dist/supply-chain/subjects/oci-linux-amd64-release-profile.json \
            --source macos-source=dist/supply-chain/subjects/macos-source-quickstart.json \
            --source security-observability=dist/supply-chain/subjects/config-secrets-probes-observability-security.json \
            --source supply-chain=release-inputs/source-reports/checksums-signature-sbom-provenance.json \
            --source failure-soak=dist/supply-chain/subjects/failure-fuzz-resource-and-one-hour-sqlite-soak.json \
            --source reference-performance=dist/supply-chain/subjects/reference-performance-per-backend.json \
            --source pack-component-conformance=dist/supply-chain/subjects/worldstream-negotiate-evidence.json \
            --source negotiate-policy=dist/supply-chain/subjects/negotiate-oracle-a202-and-privacy.json \
            --source negotiate-sqlite-restart=dist/supply-chain/subjects/negotiate-released-artifact-sqlite-restart-replay.json \
            --source negotiate-postgres-restart=dist/supply-chain/subjects/negotiate-released-artifact-postgresql-restart-replay.json
          version='${{ needs.release-evidence.outputs.product_version }}'
          mkdir -p final-inputs/payload
          cp --no-clobber "dist/worldstream-${version}-source.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-linux-x86_64.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-windows-x64.zip" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-oci-linux-amd64.oci.tar" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-a202-adapter.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-deterministic-agents.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-documentation.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-examples.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-licenses.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-negotiate.wspack" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-negotiate-evidence-verifier.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-pack-toolchain.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-participant-console.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-release-metadata.tar.gz" final-inputs/payload/
          cp --no-clobber "dist/worldstream-${version}-typescript-pack-sdk.tar.gz" final-inputs/payload/
          scripts/release-evidence-assemble.sh \
            --release-dir dist \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --payload-dir final-inputs/payload \
            --reports-dir release-inputs/reports \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json \
            --check-inputs
      - name: Assemble detached v3 release manifest
        run: |
          scripts/release-evidence-assemble.sh \
            --release-dir dist \
            --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" \
            --payload-dir final-inputs/payload \
            --reports-dir release-inputs/reports \
            --manifest-toml compatibility.toml \
            --manifest-json compatibility.json \
            --output dist/release-manifest.json
      - id: final_manifest
        name: Bind exact final-manifest signing inputs
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          manifest=dist/release-manifest.json
          test -f "$manifest" && test ! -L "$manifest"
          test -f dist/supply-chain/subject-inventory.bundle.json
          test ! -e dist/sigstore.bundle.json
          test "$(find dist -type l | wc -l)" -eq 0
          test "$(find dist -type f | wc -l)" -eq 56
          test "$(find dist/evidence -maxdepth 1 -type f | wc -l)" -eq 18
          test "$(find dist/supply-chain/subjects -maxdepth 1 -type f | wc -l)" -eq 17
          (cd dist && sha256sum --strict --check SHA256SUMS)
          printf 'manifest_sha256=%s\n' "$(sha256sum "$manifest" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'manifest_size_bytes=%s\n' "$(stat -c %s "$manifest")" >> "$GITHUB_OUTPUT"
          printf 'layout_sha256=%s\n' "$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload exact unsigned final-manifest layout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-final-manifest-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release-manifest-signing:
    name: Sign exact detached final manifest
    needs: [release-clock, release-evidence, release-signing, release-finalize]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    environment: worldstream-release
    permissions:
      contents: read
      id-token: write
    outputs:
      bundle_sha256: ${{ steps.sign_manifest.outputs.bundle_sha256 }}
      bundle_size_bytes: ${{ steps.sign_manifest.outputs.bundle_size_bytes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COSIGN_CERTIFICATE_IDENTITY: https://github.com/imom39a/worldstream/.github/workflows/compatibility-gates.yml@refs/heads/main
      COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
      EXPECTED_INVENTORY_SHA256: ${{ needs.release-evidence.outputs.inventory_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.release-finalize.outputs.manifest_sha256 }}
      EXPECTED_MANIFEST_SIZE_BYTES: ${{ needs.release-finalize.outputs.manifest_size_bytes }}
      EXPECTED_LAYOUT_SHA256: ${{ needs.release-finalize.outputs.layout_sha256 }}
    steps:
      - name: Download exact unsigned final-manifest layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-final-manifest-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: signing-input
      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - id: sign_manifest
        name: Verify exact final layout and sign only manifest bytes
        shell: bash
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          manifest=signing-input/release-manifest.json
          inventory=signing-input/supply-chain/subject-inventory.json
          inventory_bundle=signing-input/supply-chain/subject-inventory.bundle.json
          test -f "$manifest" && test ! -L "$manifest"
          test -f "$inventory" && test ! -L "$inventory"
          test -f "$inventory_bundle" && test ! -L "$inventory_bundle"
          test ! -e signing-input/sigstore.bundle.json
          test "$(find signing-input -type l | wc -l)" -eq 0
          test "$(find signing-input -type f | wc -l)" -eq 56
          test "$(find signing-input/evidence -maxdepth 1 -type f | wc -l)" -eq 18
          test "$(find signing-input/supply-chain/subjects -maxdepth 1 -type f | wc -l)" -eq 17
          test "$(sha256sum "$inventory" | cut -d ' ' -f 1)" = "$EXPECTED_INVENTORY_SHA256"
          test "$(sha256sum "$manifest" | cut -d ' ' -f 1)" = "$EXPECTED_MANIFEST_SHA256"
          test "$(stat -c %s "$manifest")" = "$EXPECTED_MANIFEST_SIZE_BYTES"
          test "$(cd signing-input && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)" = "$EXPECTED_LAYOUT_SHA256"
          (cd signing-input && sha256sum --strict --check SHA256SUMS)
          cosign verify-blob \
            --bundle "$inventory_bundle" \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            "$inventory" >/dev/null
          mkdir signing-output
          bundle=signing-output/sigstore.bundle.json
          cosign sign-blob --yes --bundle "$bundle" "$manifest" >/dev/null
          test -s "$bundle" && test ! -L "$bundle"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            "$manifest" >/dev/null
          test "$(find signing-output -type f | wc -l)" -eq 1
          printf 'bundle_sha256=%s\n' "$(sha256sum "$bundle" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'bundle_size_bytes=%s\n' "$(stat -c %s "$bundle")" >> "$GITHUB_OUTPUT"
      - name: Upload exact detached final-manifest signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-final-manifest-signature-${{ github.sha }}-${{ github.run_attempt }}
          path: signing-output/sigstore.bundle.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release-verify:
    name: Verify and upload immutable release bundle
    needs: [release-clock, release-evidence, release-finalize, release-manifest-signing]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORLDSTREAM_RELEASE_DEADLINE_EPOCH_SECONDS: ${{ needs.release-clock.outputs.deadline_epoch_seconds }}
      COSIGN_CERTIFICATE_IDENTITY: https://github.com/imom39a/worldstream/.github/workflows/compatibility-gates.yml@refs/heads/main
      COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned final-verification dependencies
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          uv python install 3.14.7
          uv sync --project sdk/python --locked
          release_python="$(uv python find 3.14.7)"
          test "$("$release_python" -I -c 'import platform; print(platform.python_version())')" = 3.14.7
          printf 'WORLDSTREAM_RELEASE_PYTHON=%s\n' "$release_python" >> "$GITHUB_ENV"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
          cargo fetch --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm and install byte-pinned scanners
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          scripts/gates-install-tools.sh
      - name: Install pinned cosign for verification only
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download exact unsigned final-manifest layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-final-manifest-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - name: Download exact detached final-manifest signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-final-manifest-signature-${{ github.sha }}-${{ github.run_attempt }}
          path: signed-input
      - name: Bind exact detached signature into the final release layout
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          bundle=signed-input/sigstore.bundle.json
          test -f "$bundle" && test ! -L "$bundle"
          test "$(find signed-input -type f | wc -l)" -eq 1
          test "$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)" = "${{ needs.release-finalize.outputs.layout_sha256 }}"
          test "$(sha256sum "$bundle" | cut -d ' ' -f 1)" = "${{ needs.release-manifest-signing.outputs.bundle_sha256 }}"
          test "$(stat -c %s "$bundle")" = "${{ needs.release-manifest-signing.outputs.bundle_size_bytes }}"
          test ! -e dist/sigstore.bundle.json
          cp --no-clobber "$bundle" dist/sigstore.bundle.json
          test "$(find dist -type l | wc -l)" -eq 0
          test "$(find dist -type f | wc -l)" -eq 57
      - name: Verify both detached release signatures and all subjects
        run: scripts/verify-release.sh dist --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY"
      - name: Run final release gate without OIDC
        run: uv run --python 3.14.7 --no-project python scripts/gates.py release --release-inventory "$WORLDSTREAM_RELEASE_INVENTORY" --ci --strict --report reports/release-gate.json --handoff reports/release-evidence-handoff.json --offline
      - name: Upload immutable verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-bundle-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload release gate handoff
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-handoff
          path: reports/
          if-no-files-found: warn
