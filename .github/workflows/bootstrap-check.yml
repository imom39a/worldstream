name: Bootstrap check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-bootstrap:
    name: Native bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.97.1
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true

      - name: Install Python 3.14.7
        shell: pwsh
        run: uv python install 3.14.7

      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-local.ps1

      - name: Verify on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-local.sh

      - name: Scope statement
        shell: pwsh
        run: Write-Host 'Bootstrap evidence only; this workflow does not claim release support.'
