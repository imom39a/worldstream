name: Hosted foundation gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-boundaries:
    name: Hosted application boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Test the isolated Fly gateway
        run: cargo test --locked -p worldstream-hosted-gateway
      - name: Test retained hosted spectator setup
        run: |
          cargo test --locked -p worldstream-hosted-contract
          pnpm --filter @worldstream/hosted-contract lint
          pnpm --filter @worldstream/hosted-contract test
          cargo test --locked -p worldstream-studio-supervisor --test room_setup_spec
          cargo test --locked -p worldstream-studio-supervisor --test room_setup_operations
          cargo test --locked -p worldstream-studio-supervisor --test room_creation production_http_creator_reuses_one_sealed_spectator_bearer_on_retry
          cargo test --locked -p worldstream-server hosted_room_creation_is_atomic_restartable_and_non_playing --lib
      - name: Test the platform BFF
        run: pnpm hosted-platform:check

  database-boundary:
    name: Supabase private identity boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: local-ci-client
      SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: local-ci-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.116.0
      - name: Start the minimum local Supabase stack
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations from a clean database
        run: supabase db reset
      - name: Run pgTAP identity and grant tests
        run: supabase test db
      - name: Run formation concurrency probes
        run: pnpm hosted-formation:concurrency
      - name: Verify the exact PostgREST schema exposure
        run: |
          status_file="$RUNNER_TEMP/worldstream-supabase.env"
          anonymous_openapi="$RUNNER_TEMP/worldstream-anonymous-openapi.json"
          service_openapi="$RUNNER_TEMP/worldstream-service-openapi.json"
          supabase status -o env > "$status_file"
          set -a
          source "$status_file"
          set +a
          curl --fail --silent --show-error --header "apikey: $ANON_KEY" \
            "$REST_URL/" --output "$anonymous_openapi"
          curl --fail --silent --show-error --header "apikey: $SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SERVICE_ROLE_KEY" \
            "$REST_URL/" --output "$service_openapi"
          node scripts/verify-supabase-schema-exposure.mjs \
            "$anonymous_openapi" "$service_openapi"
      - name: Run database lint and advisors
        run: |
          supabase db lint --local --schema platform_store,platform_api --level warning --fail-on error
          supabase db advisors --local --type security --level warn --fail-on error
