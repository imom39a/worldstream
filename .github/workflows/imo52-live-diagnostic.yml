name: IMO-52 hosted Linux live diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/imo52-live-diagnostic.yml
      - scripts/postgres-native-restore-smoke.sh
      - scripts/postgres-native-restore-hosted-report.py
      - crates/worldstream-postgres/**
      - crates/worldstream-runtime/**
      - tests/postgres_native_restore_smoke.py

permissions:
  contents: read

jobs:
  native-postgres-restore:
    name: PostgreSQL 17.11 native backup restore and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Prime locked Rust dependencies
        run: cargo fetch --locked
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.5
          enable-cache: true
      - name: Install pinned Python
        run: |
          uv python install 3.14.7
      - name: Run standalone PostgreSQL native restore smoke diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python_bin="$(uv python find 3.14.7)"
          cargo_bin="$(rustup which --toolchain 1.97.1 cargo)"
          docker_bin=/usr/bin/docker
          for executable in "$python_bin" "$cargo_bin" "$docker_bin"; do
            test -x "$executable"
          done
          WORLDSTREAM_NATIVE_PG_PYTHON="$python_bin" \
          WORLDSTREAM_NATIVE_PG_CARGO="$cargo_bin" \
          WORLDSTREAM_NATIVE_PG_DOCKER="$docker_bin" \
            scripts/postgres-native-restore-smoke.sh \
              --evidence reports/imo52-native-postgres-restore-smoke.json
      - name: Upload the non-release diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imo52-hosted-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/imo52-native-postgres-restore-smoke.json
          if-no-files-found: warn
