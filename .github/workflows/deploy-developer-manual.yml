name: Deploy developer manual

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-developer-manual.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/verify-developer-manual.mjs
      - web/manual/**
      - web/design/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify developer manual
        run: |
          pnpm docs:test
          pnpm docs:lint
          pnpm docs:verify

      - name: Configure GitHub Pages
        if: vars.WORLDSTREAM_DEPLOY_MANUAL_PAGES == 'true'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build developer manual
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm docs:build

      - name: Upload Pages artifact
        if: vars.WORLDSTREAM_DEPLOY_MANUAL_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/manual/dist

  deploy:
    name: Deploy
    if: vars.WORLDSTREAM_DEPLOY_MANUAL_PAGES == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
