  WORLDSTREAM_DEPLOYMENT_ENVIRONMENT = "production"
  WORLDSTREAM_HOSTED_INSTALLATION_ID = "fly-primary"
  WORLDSTREAM_LISTING_ALLOWLIST = "blake3:0cd11b3aee7596f0f4c2ff5640247c29038f903914d0206a784f7adde8a84c46,blake3:3cdaaa7b2402b816ded0b36d5419f405b1be1428b37c89155a805d39bf826069,blake3:1cf75abcb30d77fdbe0abc5e39813a315bea6900c61e9b49c51b84d995335d74,blake3:21d7d5439208df0b1dbb18f7f42f3a3687d248a523b03fb5b4184b2dd0dcb626,blake3:5b0993de4c858771cce34b16cb25e03b2bf509cbe16cd1ce7249a789ea8c426f,blake3:350beff2dbb28d495a5355ac19a7580f8494589bc0d5c6fec1c521be86a7cf38,blake3:ab6d61d35786e51e3849c68467aad664bd35cb41f299b86d1bcce3f52e4249db,blake3:79400919b61a051f4de82824a9a7f6414be609609802ece11ca1137fc8fbdf65,blake3:735865c4246282c89d37858c9ee9de99a05ae4557fdef5dca5ea365f90f031b0,blake3:a12a29ad0382c7053a14295a60d017fbdc817c24e513521f85be982f5ec07dfc,blake3:10135b2b12664dec3fc51a23c917d8468474af93b9c20ee5ed068b61e2dee61c,blake3:e202f7b24dbd99caeef6d8a1c904ae8131143d38af17a9512e562fe523654ed0,blake3:8252e311f9ebbe20d1041877511932c9fac51155e0b26f6a247046fb383ddd99,blake3:8106c3f34f52c8a2a216f2a88c842cea7b44db0241db4b0430e2c02a38f34f13,blake3:f7beef31cc1160418a103963b7d3884e5f3a71ca1e4fc5c1c0a09d7cb98c909a,blake3:48c397a32632896d66beb9ae7f8a6d090338800187c56eb0593997b80bd2b630,blake3:48f76e8c1336e8f50fb6952cd0f2ff4c47cc8c372594db01422a67bca9363782,blake3:9553f4fa320aa6901d0a03870f5c19ce4342d271efd2ef90d4fd287395f6cef1,blake3:04edc964d5cbc1bc5efa422ac856305d55cec609a6ae5c5c1814c8389b776f80,blake3:e3d401e783cec1ae4f911f682e8289054275dece60a0482b02f63e872f27dcc1,blake3:d3f2c55783a791542945c8a8946a58184b35866f6548539e753edc7349881956"

[mounts]
  source = "worldstream_data"
  destination = "/var/lib/worldstream"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 256

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/readyz"

[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
