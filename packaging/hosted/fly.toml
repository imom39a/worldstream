primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "packaging/hosted/Dockerfile"

[env]
  NODE_ENV = "production"
  WORLDSTREAM_DEPLOYMENT_ENVIRONMENT = "production"
  WORLDSTREAM_HOSTED_INSTALLATION_ID = "fly-primary"
  WORLDSTREAM_LISTING_ALLOWLIST = "blake3:48f76e8c1336e8f50fb6952cd0f2ff4c47cc8c372594db01422a67bca9363782,blake3:9553f4fa320aa6901d0a03870f5c19ce4342d271efd2ef90d4fd287395f6cef1,blake3:04edc964d5cbc1bc5efa422ac856305d55cec609a6ae5c5c1814c8389b776f80,blake3:e3d401e783cec1ae4f911f682e8289054275dece60a0482b02f63e872f27dcc1,blake3:d3f2c55783a791542945c8a8946a58184b35866f6548539e753edc7349881956"

[mounts]
  source = "worldstream_data"
  destination = "/var/lib/worldstream"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 256

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/readyz"

[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
