[workspace]
members = [
    "crates/worldstream-protocol",
    "crates/worldstream-runtime",
    "crates/worldstream-server",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/imom39a/agent-streamer"

[workspace.dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "=4.6.6", features = ["derive"] }
directories = "=6.0.0"
filedescriptor = "=0.8.3"
http-body-util = "=0.1.5"
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "=0.9.8"
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
windows-permissions = "=0.2.4"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
winsafe = { version = "=0.0.28", default-features = false, features = ["kernel"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
