<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldStream · Minesweeper · JEV</title>
  <style>
    :root { color-scheme: dark; --bg:#090d12; --panel:#121a22; --line:#2a3946; --ink:#f3efe4; --muted:#9ca9b2; --accent:#74d5c0; --gold:#ffd166; --bad:#ff7182; --good:#83e3a6; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 12% 0%,rgba(116,213,192,.14),transparent 30rem),var(--bg); font-family:Inter,ui-sans-serif,system-ui,sans-serif }
    button,select,input { font:inherit } button { cursor:pointer } main { width:min(1680px,calc(100% - 32px)); margin:0 auto; padding:24px 0 80px }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; padding-bottom:18px; border-bottom:1px solid var(--line) } .eyebrow { color:var(--gold); font:700 .64rem ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase } h1 { margin:7px 0 0; font-size:clamp(2rem,4vw,4.2rem); letter-spacing:-.06em; line-height:.9 } .status { display:flex; gap:9px; align-items:center; border:1px solid var(--line); border-radius:99px; color:var(--muted); padding:9px 12px; font:700 .66rem ui-monospace,monospace; text-transform:uppercase; white-space:nowrap } .dot { width:8px; height:8px; border-radius:50%; background:var(--gold) } .status.running .dot { background:var(--good) } .status.error .dot { background:var(--bad) } .status.complete .dot { background:var(--good) }
    .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-top:16px } .control { display:grid; gap:5px; color:var(--muted); font:700 .62rem ui-monospace,monospace; letter-spacing:.04em; text-transform:uppercase } select,input[type=number],input[type=text] { min-width:110px; border:1px solid var(--line); border-radius:8px; background:#0c1319; color:var(--ink); padding:8px 10px; font-size:.78rem } input[type=number] { min-width:80px; width:92px } .primary,.secondary { border:1px solid transparent; border-radius:9px; padding:9px 13px; font-size:.76rem; font-weight:750 } .primary { color:#111820; background:var(--gold) } .secondary { color:var(--ink); border-color:var(--line); background:transparent } .primary:disabled,.secondary:disabled { opacity:.45; cursor:default }
    .board-wrap { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:1px; margin-top:16px; background:var(--line); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 18px 55px rgba(0,0,0,.28) } .board-pane { background:#0b1218; min-width:0; height:min(70vh,660px) } canvas { display:block; width:100%; height:100% }
    .side { background:var(--panel); padding:13px 14px; overflow:auto } .side-head { display:flex; align-items:center; justify-content:space-between; gap:10px } .side-head h2 { margin:0; font-size:.95rem } .side-head small { color:var(--muted); font:700 .6rem ui-monospace,monospace; text-transform:uppercase }
    .decision-trace { margin-top:12px; color:#dbe5e6 } .decision-trace.empty { color:var(--muted); font-size:.66rem } .decision-kicker { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font:700 .57rem ui-monospace,monospace; letter-spacing:.07em; text-transform:uppercase } .decision-choice { margin-top:5px; color:var(--ink); font:800 .95rem ui-monospace,monospace } .decision-action { margin-top:3px; color:var(--gold); font:700 .63rem ui-monospace,monospace } .decision-meta { display:flex; flex-wrap:wrap; gap:5px 8px; margin-top:7px; color:var(--muted); font:600 .58rem ui-monospace,monospace } .confidence { display:flex; align-items:center; gap:8px; margin-top:9px; color:var(--muted); font:700 .57rem ui-monospace,monospace; text-transform:uppercase } .confidence i { flex:1; height:6px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden } .confidence i b { display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--gold),var(--good)) } .decision-bars { display:grid; gap:5px; margin-top:10px } .decision-bar { display:grid; grid-template-columns:minmax(0,1fr) 58px 30px; align-items:center; gap:6px; color:var(--muted); font:600 .58rem ui-monospace,monospace } .decision-bar i { display:block; height:5px; border-radius:99px; background:linear-gradient(90deg,var(--gold),var(--good)); transform-origin:left center } .decision-bar span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .decision-bar b { text-align:right; color:#dbe5e6 } .decision-reason { margin-top:8px; color:#c1cdd0; font-size:.65rem; line-height:1.35 }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:16px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden } .stat { padding:12px 14px; background:var(--panel) } .stat span { display:block; color:var(--muted); font:700 .58rem ui-monospace,monospace; text-transform:uppercase } .stat b { display:block; margin-top:6px; font-size:1.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .stat b.success { color:var(--good) } .stat b.failure { color:var(--bad) } .stat b.gold { color:var(--gold) }
    .timer { text-align:center } .timer strong { display:block; font:800 2.2rem/1 ui-monospace,monospace; letter-spacing:-.06em } .timer span { color:var(--muted); font:700 .58rem ui-monospace,monospace; text-transform:uppercase }
    @media (max-width:820px) { .board-wrap { grid-template-columns:1fr } .board-pane { height:56vh } .side { max-height:280px } .stats { grid-template-columns:repeat(2,1fr) } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">WorldStream / Minesweeper · JEV only</div><h1>JEV plays Minesweeper</h1></div>
      <div class="status" id="status"><i class="dot"></i><span>idle · ready</span></div>
    </header>

    <div class="controls">
      <label class="control">Width<input id="width" type="number" min="2" max="500" value="30"></label>
      <label class="control">Height<input id="height" type="number" min="2" max="500" value="16"></label>
      <label class="control">Mines<input id="mines" type="number" min="1" max="249999" value="99"></label>
      <label class="control">Time (s)<input id="duration" type="number" min="5" max="3600" value="900"></label>
      <label class="control">Candidates<input id="candidateLimit" type="number" min="4" max="48" value="20" title="Max cells offered to JEV per round"></label>
      <label class="control">Seed<input id="seed" type="text" placeholder="optional"></label>
      <label class="control">JEV model<select id="jevModel"></select></label>
      <button class="secondary" id="stop" disabled>Stop</button>
      <button class="primary" id="start">Start JEV</button>
    </div>

    <section class="board-wrap">
      <div class="board-pane"><canvas id="board" aria-label="JEV Minesweeper board"></canvas></div>
      <div class="side">
        <div class="side-head"><h2>Decision</h2><small id="roundLabel">round 0</small></div>
        <div class="decision-trace empty" id="decision" aria-live="polite">No decision yet.</div>
      </div>
    </section>

    <section class="stats">
      <div class="stat timer"><strong id="timer">15:00</strong><span id="timerLabel">not started</span></div>
      <div class="stat"><span>Revealed</span><b id="revealed">0 / 0</b></div>
      <div class="stat"><span>Mines left</span><b id="minesLeft">99</b></div>
      <div class="stat"><span>Outcome</span><b id="outcome">waiting</b></div>
    </section>
  </main>

  <script>
    const sample = { width:30, height:16, mines:99, phase:'ready', round:0, cells:'?'.repeat(480), revealed_count:0, safe_total:381, flags:0, boom:null, outcome:{status:'ready', moves:0, revealed:0, safe_total:381} };
    const state = { config:null, timer:{status:'idle'}, status:'idle', model:'', elapsed_ms:null, event_total:0, projection:sample, decisions:[] };
    const $ = id => document.getElementById(id);
    const number = n => Number(n ?? 0).toLocaleString('en-US');
    const duration = ms => { const total = Math.max(0, Math.round(Number(ms) / 1000)); return `${String(Math.floor(total / 60)).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`; };
    const DIGIT_COLORS = { '1':'#69b9ff','2':'#72e0a1','3':'#ff9a5c','4':'#947ff1','5':'#ffd166','6':'#74d5c0','7':'#f386d4','8':'#d28cff' };
    const COLORS = { '?':[34,49,60], 'F':[255,209,102], '*':[255,113,130], '0':[16,24,32] };

    function colorFor(token) {
      if (token === '?') return COLORS['?'];
      if (token === 'F') return COLORS['F'];
      if (token === '*') return COLORS['*'];
      const hex = DIGIT_COLORS[token] || '#dbe5e6';
      return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
    }

    function draw() {
      const canvas = $('board');
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const ctx = canvas.getContext('2d');
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = rect.width, h = rect.height, p = state.projection;
      ctx.clearRect(0, 0, w, h);
      if (!p || typeof p.cells !== 'string') return;
      const cols = p.width, rows = p.height, pad = 10;
      const scale = Math.min((w - 2 * pad) / cols, (h - 2 * pad) / rows);
      const boardW = scale * cols, boardH = scale * rows;
      const ox = Math.floor((w - boardW) / 2), oy = Math.floor((h - boardH) / 2);
      if (scale >= 9) {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const token = p.cells[r * cols + c];
            const x = ox + c * scale, y = oy + r * scale;
            if (token === '?') { ctx.fillStyle = '#22313c'; ctx.fillRect(x, y, scale - 1, scale - 1); }
            else if (token === 'F') { ctx.fillStyle = '#3a2f18'; ctx.fillRect(x, y, scale - 1, scale - 1); ctx.fillStyle = '#ffd166'; ctx.font = `700 ${Math.floor(scale * 0.6)}px ui-monospace,monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('F', x + scale / 2, y + scale / 2); }
            else if (token === '*') { ctx.fillStyle = '#2b1a20'; ctx.fillRect(x, y, scale - 1, scale - 1); ctx.fillStyle = '#ff7182'; ctx.font = `800 ${Math.floor(scale * 0.6)}px ui-monospace,monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('*', x + scale / 2, y + scale / 2); }
            else { ctx.fillStyle = '#101820'; ctx.fillRect(x, y, scale - 1, scale - 1); if (token !== '0') { ctx.fillStyle = DIGIT_COLORS[token] || '#dbe5e6'; ctx.font = `700 ${Math.floor(scale * 0.58)}px ui-monospace,monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(token, x + scale / 2, y + scale / 2); } }
          }
        }
      } else {
        const off = document.createElement('canvas');
        off.width = cols; off.height = rows;
        const octx = off.getContext('2d');
        const image = octx.createImageData(cols, rows);
        for (let i = 0; i < cols * rows; i++) {
          const [r, g, b] = colorFor(p.cells[i]);
          const o = i * 4;
          image.data[o] = r; image.data[o + 1] = g; image.data[o + 2] = b; image.data[o + 3] = 255;
        }
        octx.putImageData(image, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(off, ox, oy, boardW, boardH);
      }
      if (Array.isArray(p.boom)) {
        ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
        ctx.strokeRect(ox + p.boom[1] * scale - 1, oy + p.boom[0] * scale - 1, scale + 1, scale + 1);
      }
    }

    function renderDecision() {
      const box = $('decision');
      const decision = (state.decisions || []).filter(item => item && item.kind === 'participant_decision').at(-1);
      if (!decision) { box.className = 'decision-trace empty'; box.replaceChildren(Object.assign(document.createElement('span'), { textContent: 'No decision yet.' })); return; }
      const selected = decision.selected || {};
      box.className = 'decision-trace';
      const kicker = document.createElement('div'); kicker.className = 'decision-kicker';
      kicker.append(
        Object.assign(document.createElement('span'), { textContent: `JEV · round ${number(decision.round)}` }),
        Object.assign(document.createElement('span'), { textContent: decision.fallback ? 'fallback' : (decision.reason || 'choice') })
      );
      box.replaceChildren(kicker);
      box.append(Object.assign(document.createElement('div'), { className: 'decision-choice', textContent: `reveal ${selected.cell || '—'}` }));
      box.append(Object.assign(document.createElement('div'), { className: 'decision-action', textContent: decision.fallback ? 'no usable choice' : `row ${number((selected.row ?? 0) + 1)} · col ${number((selected.col ?? 0) + 1)}` }));
      if (decision.provider_model) {
        const meta = document.createElement('div'); meta.className = 'decision-meta';
        meta.append(Object.assign(document.createElement('span'), { textContent: `model ${decision.provider_model}` }));
        box.append(meta);
      }
      const confidence = Number(decision.confidence);
      if (Number.isFinite(confidence)) {
        const wrap = document.createElement('div'); wrap.className = 'confidence';
        wrap.append(Object.assign(document.createElement('span'), { textContent: 'conf' }));
        const track = document.createElement('i'); const fill = document.createElement('b');
        fill.style.width = `${Math.round(Math.max(0, Math.min(1, confidence)) * 100)}%`;
        track.append(fill); wrap.append(track);
        wrap.append(Object.assign(document.createElement('span'), { textContent: `${Math.round(confidence * 100)}%` }));
        box.append(wrap);
      }
      const probabilities = decision.probabilities;
      if (probabilities && typeof probabilities === 'object') {
        const entries = Object.entries(probabilities).filter(([, v]) => typeof v === 'number').sort((a, b) => b[1] - a[1]).slice(0, 6);
        if (entries.length) {
          const bars = document.createElement('div'); bars.className = 'decision-bars';
          for (const [label, value] of entries) {
            const bar = document.createElement('div'); bar.className = 'decision-bar';
            bar.append(Object.assign(document.createElement('span'), { textContent: label }));
            const track = document.createElement('i'); track.style.transform = `scaleX(${Math.max(0, Math.min(1, value))})`; bar.append(track);
            bar.append(Object.assign(document.createElement('b'), { textContent: `${Math.round(value * 100)}%` }));
            bars.append(bar);
          }
          box.append(bars);
        }
      }
    }

    function render() {
      const p = state.projection || sample;
      const running = ['running', 'preparing', 'arming'].includes(state.timer.status);
      const finalMs = Number.isFinite(state.timer.frozen_elapsed_ms)
        ? state.timer.frozen_elapsed_ms
        : (state.timer.status === 'complete' && Number.isFinite(state.timer.elapsed_ms) ? state.timer.elapsed_ms : null);
      const left = state.timer.deadline_at_ms ? Math.max(0, state.timer.deadline_at_ms - Date.now()) : null;
      $('timer').textContent = finalMs !== null ? duration(finalMs) : (left === null ? duration(Number($('duration').value) * 1000) : `${String(Math.floor(left / 60000)).padStart(2,'0')}:${String(Math.ceil((left % 60000) / 1000) % 60).padStart(2,'0')}`);
      $('timerLabel').textContent = state.timer.status === 'complete' ? 'complete' : finalMs !== null ? 'final' : state.timer.status === 'running' ? 'running' : 'not started';
      const status = $('status');
      status.className = 'status ' + (state.timer.status === 'complete' ? 'complete' : running ? 'running' : state.timer.status === 'error' ? 'error' : '');
      status.querySelector('span').textContent = state.timer.status === 'idle' ? 'idle · ready' : state.timer.status;
      const revealed = p.outcome?.revealed ?? p.revealed_count ?? 0;
      $('roundLabel').textContent = `round ${number(p.outcome?.moves ?? p.round ?? 0)}`;
      $('revealed').textContent = `${number(revealed)} / ${number(p.safe_total ?? 0)}`;
      $('minesLeft').textContent = number((p.mines ?? 0) - (p.flags ?? 0));
      const done = state.status === 'won', failed = state.status === 'lost';
      const outcome = $('outcome');
      outcome.textContent = done ? 'cleared' : failed ? 'mine hit' : state.status === 'time_limit' ? 'time limit' : state.status === 'ended' ? 'ended' : (p.phase || 'waiting');
      outcome.className = done ? 'success' : failed ? 'failure' : state.status === 'time_limit' ? 'gold' : '';
      renderDecision();
      $('start').disabled = running;
      $('stop').disabled = !state.config || state.timer.status === 'idle';
    }

    function apply(payload) {
      if (!payload || payload.type !== 'comparison') return;
      if (payload.config) state.config = payload.config;
      if (payload.timer) state.timer = payload.timer;
      const side = payload.sides && payload.sides.right;
      if (side) {
        state.status = side.status;
        state.model = side.model;
        state.elapsed_ms = side.elapsed_ms;
        state.event_total = side.event_total;
        if (side.projection) state.projection = side.projection;
        if (side.decisions) state.decisions = side.decisions;
      }
      render();
    }

    async function loadConfig() {
      try {
        const value = await (await fetch('/config')).json();
        const jev = (value.models || {}).jev || [];
        const select = $('jevModel');
        select.replaceChildren(...jev.map(item => Object.assign(document.createElement('option'), { value: item.id, textContent: item.label || item.id })));
        const defaults = value.defaults || {};
        if (defaults.max_dimension) { $('width').max = String(defaults.max_dimension); $('height').max = String(defaults.max_dimension); }
        if (defaults.max_mines) $('mines').max = String(defaults.max_mines);
        if (defaults.candidate_limit) $('candidateLimit').value = String(defaults.candidate_limit);
        if (!(value.keys || {}).jev) {
          $('status').className = 'status error';
          $('status').querySelector('span').textContent = 'missing JEV_API_KEY';
        }
      } catch { $('status').querySelector('span').textContent = 'config unavailable'; }
      syncMineMax();
    }

    function syncMineMax() {
      const cells = Math.max(1, Number($('width').value) * Number($('height').value));
      const max = Math.max(1, cells - 1);
      $('mines').max = String(max);
      if (Number($('mines').value) > max) $('mines').value = String(max);
    }
    $('width').addEventListener('input', syncMineMax);
    $('height').addEventListener('input', syncMineMax);

    $('start').addEventListener('click', async () => {
      const body = {
        width: Number($('width').value),
        height: Number($('height').value),
        mines: Number($('mines').value),
        duration_seconds: Number($('duration').value),
        candidate_limit: Number($('candidateLimit').value),
        left_engine: 'none',
        right_engine: 'jev',
        jev_model: $('jevModel').value,
      };
      const seed = $('seed').value.trim();
      if (seed !== '' && /^\d+$/.test(seed)) body.seed = Number(seed);
      $('start').disabled = true;
      try {
        const response = await fetch('/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'start failed');
        apply({ type: 'comparison', config: result.config, timer: { status: 'running' } });
      } catch (error) {
        $('status').className = 'status error';
        $('status').querySelector('span').textContent = error.message;
        $('start').disabled = false;
      }
    });
    $('stop').addEventListener('click', async () => { await fetch('/stop', { method: 'POST' }); });

    window.addEventListener('resize', draw);
    const feed = new EventSource('/events');
    feed.addEventListener('comparison', event => { try { apply(JSON.parse(event.data)); } catch { /* ignore */ } });
    feed.onerror = () => { if (state.timer.status === 'idle') $('status').querySelector('span').textContent = 'reconnecting'; };
    setInterval(() => { render(); draw(); }, 1000);
    loadConfig();
    render();
    draw();
  </script>
</body>
</html>
