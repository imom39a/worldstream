# Local checkout configuration. Run commands from the repository root.
config_version = 1

[server]
bind = "127.0.0.1:9410"

[storage]
profile = "sqlite-bundled"
data_dir = ".worldstream/data"
deployment_lineage = "development/local"
storage_epoch = 1

[authority.bootstrap]
secret_file = ".worldstream/authority.secret"
