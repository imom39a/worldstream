[package]
name = "worldstream-postgres"
description = "Provider-neutral PostgreSQL 17 adapter and conformance harness for WorldStream Room Commit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
conformance-tracer = ["worldstream-core/conformance-tracer"]

[dependencies]
blake3.workspace = true
command-group.workspace = true
getrandom.workspace = true
native-tls.workspace = true
os_pipe.workspace = true
postgres.workspace = true
postgres-protocol.workspace = true
postgres-native-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
worldstream-core = { path = "../worldstream-core", version = "=0.1.0" }
worldstream-backup = { path = "../worldstream-backup", version = "=0.1.0" }
worldstream-runtime = { path = "../worldstream-runtime", version = "=0.1.0" }
worldstream-transfer = { path = "../worldstream-transfer", version = "=0.1.0" }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
fs-id.workspace = true
processkit.workspace = true
tokio.workspace = true
windows-sys.workspace = true
worldstream-windows-handle = { path = "../worldstream-windows-handle", version = "=0.1.0" }

[dev-dependencies]
tempfile.workspace = true
worldstream-core = { path = "../worldstream-core", version = "=0.1.0", features = ["conformance-tracer"] }

[lints]
workspace = true
