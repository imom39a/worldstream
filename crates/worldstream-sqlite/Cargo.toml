[package]
name = "worldstream-sqlite"
description = "Bundled SQLite adapter for the prepared WorldStream Room Commit seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3.workspace = true
getrandom.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
worldstream-core = { path = "../worldstream-core", version = "=0.1.0", features = ["conformance-tracer"] }
worldstream-backup = { path = "../worldstream-backup", version = "=0.1.0" }
worldstream-sqlite-open.workspace = true
worldstream-transfer = { path = "../worldstream-transfer", version = "=0.1.0" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "time"] }

[target.'cfg(windows)'.dependencies]
fs-id.workspace = true
windows-sys.workspace = true
worldstream-windows-handle = { path = "../worldstream-windows-handle", version = "=0.1.0" }

[dev-dependencies]
tempfile.workspace = true
worldstream-core = { path = "../worldstream-core", version = "=0.1.0", features = ["conformance-tracer"] }

[lints]
workspace = true
