[package]
name = "worldstream-backup"
description = "Bounded, read-only backup metadata and semantic verification foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3.workspace = true
getrandom.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
worldstream-core = { path = "../worldstream-core", version = "=0.1.0" }
worldstream-sqlite-open.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
fs-id.workspace = true
windows-sys.workspace = true
worldstream-windows-handle = { path = "../worldstream-windows-handle", version = "=0.1.0" }

[dev-dependencies]
worldstream-core = { path = "../worldstream-core", version = "=0.1.0", features = ["conformance-tracer"] }

[lints]
workspace = true
