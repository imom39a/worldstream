[package]
name = "worldstream-server"
description = "Operator-only WorldStream process shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Integration-only until the coordinated, verified Studio cutover (IMO-146).
cli-operator-preview = ["dep:worldstream-studio-supervisor", "worldstream-studio-supervisor/cli-operator-preview"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
blake3.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true
worldstream-core = { path = "../worldstream-core", version = "=0.1.0" }
worldstream-backup = { path = "../worldstream-backup", version = "=0.1.0" }
worldstream-component-host = { path = "../worldstream-component-host", version = "=0.1.0" }
worldstream-pack-bundle = { path = "../worldstream-pack-bundle", version = "=0.1.0" }
worldstream-protocol = { path = "../worldstream-protocol", version = "=0.1.0" }
worldstream-runtime = { path = "../worldstream-runtime", version = "=0.1.0" }
worldstream-sqlite = { path = "../worldstream-sqlite", version = "=0.1.0" }
worldstream-postgres = { path = "../worldstream-postgres", version = "=0.1.0" }
worldstream-transfer = { path = "../worldstream-transfer", version = "=0.1.0" }
worldstream-studio-supervisor = { path = "../worldstream-studio-supervisor", version = "=0.1.0", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
fs-id.workspace = true
windows-sys.workspace = true
worldstream-windows-handle = { path = "../worldstream-windows-handle", version = "=0.1.0" }

[dev-dependencies]
http-body-util.workspace = true
native-tls.workspace = true
postgres.workspace = true
postgres-native-tls.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tower.workspace = true
tungstenite.workspace = true

[lints]
workspace = true

[[bin]]
name = "worldstreamd"
path = "src/bin/worldstreamd.rs"

[[bin]]
name = "worldstreamctl"
path = "src/bin/worldstreamctl.rs"
