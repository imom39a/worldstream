[dev-dependencies]
worldstream-pack-bundle = { path = "../worldstream-pack-bundle", version = "=0.1.0" }
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true

[[bin]]
name = "worldstream-studio-supervisor"
path = "src/main.rs"
test = false

[[bin]]
name = "worldstream-assignment-mcp"
path = "src/assignment_mcp_main.rs"
