[package]
name = "worldstream-studio-supervisor"
description = "Bounded local control-plane boundary for WorldStream Studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
blake3.workspace = true
clap.workspace = true
getrandom.workspace = true
ring.workspace = true
rustix.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tungstenite.workspace = true
webpki-roots.workspace = true
winsafe.workspace = true
worldstream-runtime = { path = "../worldstream-runtime", version = "=0.1.0" }
worldstream-protocol = { path = "../worldstream-protocol", version = "=0.1.0" }
worldstream-core = { path = "../worldstream-core", version = "=0.1.0" }
worldstream-hosted-contract = { path = "../worldstream-hosted-contract", version = "=0.1.0" }
worldstream-activity-client = { path = "../worldstream-activity-client", version = "=0.1.0" }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
