[package]
name = "worldstream-agent-swarm"
description = "Local terminal application boundary for Agent Swarm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
atomicwrites = "=0.4.4"
blake3.workspace = true
clap.workspace = true
command-group.workspace = true
crossterm = "=0.29.0"
directories.workspace = true
getrandom = { workspace = true, optional = true }
ratatui = { version = "=0.30.0", default-features = false, features = ["crossterm"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
worldstream-core = { path = "../../../crates/worldstream-core", version = "=0.1.0" }
worldstream-protocol = { path = "../../../crates/worldstream-protocol", version = "=0.1.0", optional = true }
worldstream-runtime = { path = "../../../crates/worldstream-runtime", version = "=0.1.0" }
worldstream-studio-supervisor = { path = "../../../crates/worldstream-studio-supervisor", version = "=0.1.0", optional = true }

[target.'cfg(windows)'.dependencies]
fs-id.workspace = true

[features]
default = []
managed-local-runtime = [
    "dep:getrandom",
    "dep:worldstream-protocol",
    "dep:worldstream-studio-supervisor",
]

[dev-dependencies]
portable-pty = "=0.9.0"
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "worldstream-agent-swarm"
path = "src/main.rs"
test = false

[[bin]]
name = "worldstream-agent-swarm-process-guard"
path = "src/bin/process_guard.rs"
required-features = ["managed-local-runtime"]
test = false

[[bin]]
name = "worldstream-agent-swarm-controlled-worker"
path = "src/bin/controlled_worker.rs"
required-features = ["managed-local-runtime"]
test = false

[[bin]]
name = "worldstream-agent-swarmd"
path = "src/bin/agent_swarmd.rs"
required-features = ["managed-local-runtime"]
test = false

[[bin]]
name = "worldstream-agent-swarmctl"
path = "src/bin/agent_swarmctl.rs"
required-features = ["managed-local-runtime"]
test = false
