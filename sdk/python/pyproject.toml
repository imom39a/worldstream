[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "worldstream-sdk"
version = "0.1.0"
description = "WorldStream Python SDK package skeleton"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic==2.13.4",
  "websockets==17.0.1",
]

[dependency-groups]
dev = [
  "blake3==1.0.9",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worldstream_sdk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
package = true
